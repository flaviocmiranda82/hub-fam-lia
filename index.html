async function desenhar(ev){
  await (document.fonts?document.fonts.ready:Promise.resolve());

  if(ev.responsavel)linhas.push(["LOGÍSTICA","Quem leva: "+ev.responsavel]);
  const H=250+linhas.length*64,c=document.createElement("canvas");c.width=W*s;c.height=H*s;const x=c.getContext("2d");x.scale(s,s);

  const pal=(ev.titulo||"Evento").split(" ");let l1="",l2="";for(const p of pal){const t=(l1?l1+" ":"")+p;if(x.measureText(t).width<W-2*P-20&&!l2)l1=t;else l2=(l2?l2+" ":"")+p;}

    setCarregando(false);

}

function escICS(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");}
function icsData(d,t){const dd=String(d||"").replace(/-/g,"");if(!t)return dd;return dd+"T"+String(t).replace(":","")+"00";}
function maisUmaHora(t){const p=String(t).split(":");let h=Number(p[0]||0),m=Number(p[1]||0);h=(h+1)%24;return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");}
function proximoDia(d){const dt=new Date(d+"T00:00:00");dt.setDate(dt.getDate()+1);return dt.toISOString().slice(0,10);}
function baixarICS(ev){
  const stamp=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const temHora=!!ev.inicio;
  let dtStart,dtEnd;
  if(ev.tipo==="viagem"&&ev.data_fim){dtStart="DTSTART;VALUE=DATE:"+icsData(ev.data,"");dtEnd="DTEND;VALUE=DATE:"+icsData(proximoDia(ev.data_fim),"");}
  else if(temHora){dtStart="DTSTART:"+icsData(ev.data,ev.inicio);const fim=ev.fim||maisUmaHora(ev.inicio);dtEnd="DTEND:"+icsData(ev.data,fim);}
  else{dtStart="DTSTART;VALUE=DATE:"+icsData(ev.data,"");dtEnd="DTEND;VALUE=DATE:"+icsData(proximoDia(ev.data),"");}
  const linhas=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Hub da Familia//PT-BR","CALSCALE:GREGORIAN","BEGIN:VEVENT","UID:"+(ev.id||Date.now())+"@hubfamilia","DTSTAMP:"+stamp,dtStart,dtEnd,"SUMMARY:"+escICS(ev.titulo),ev.local?"LOCATION:"+escICS(ev.local):"",ev.convidado?"DESCRIPTION:"+escICS("Aniversariante/convidado: "+ev.convidado):"","END:VEVENT","END:VCALENDAR"].filter(Boolean);
  const ics=linhas.join("\r\n");
  const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=(ev.titulo||"evento").replace(/[^a-z0-9]/gi,"_")+".ics";
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1500);
}

function Agenda(props){
  const toast=props.toast;
  const vazio={titulo:"",data:"",data_fim:"",inicio:"",fim:"",local:"",convidado:"",festa_infantil:false,responsavel:"",tipo:"evento",pai_id:null,repetir:"nao",dias_sem:[],ate:""};
  const [eventos,setEventos]=useState([]),[abrir,setAbrir]=useState(false),[n,setN]=useState(vazio),[lendo,setLendo]=useState(false),[editId,setEditId]=useState(null);

  useEffect(function(){carregar();const ch=sb.channel("ev").on("postgres_changes",{event:"*",schema:"public",table:"eventos"},carregar).subscribe();return function(){sb.removeChannel(ch);};},[]);
  const ehViagem=function(ev){return ev.tipo==="viagem";};
  const faltaEv=function(ev){ if(ehViagem(ev)&&ev.data_fim){ var n0=dAte(ev.data),n1=dAte(ev.data_fim); if(n1===null)return falta(ev.data); if(n1<0)return"já passou"; if(n0!==null&&n0<=0)return"em andamento"; } return falta(ev.data); };
  const corFaltaEv=function(ev){ if(ehViagem(ev)&&ev.data_fim){ var n0=dAte(ev.data),n1=dAte(ev.data_fim); if(n1!==null&&n1<0)return{bg:"#F0EBE3",fg:"#857A8C"}; if(n0!==null&&n1!==null&&n0<=0&&n1>=0)return{bg:"#E6F4EA",fg:"#2F9E44"}; } return corFalta(ev.data); };
  async function salvar(){
    if(!n.titulo.trim()){toast("Dê um nome.");return;}
    if(!n.data){toast("Escolha a data"+(n.tipo==="viagem"?" de início.":"."));return;}
    if(n.tipo==="viagem"){ if(!n.data_fim){toast("Escolha a data de fim do período.");return;} if(n.data_fim<n.data){toast("O fim não pode ser antes do início.");return;} }
    var p=Object.assign({},n);
    if(p.tipo!=="viagem"){p.data_fim=null;} else {p.inicio="";p.fim="";}
    delete p.repetir; delete p.dias_sem; delete p.ate;

      var fmtISO=function(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
      var serie="s"+Date.now()+Math.floor(Math.random()*1000);
      var ini=new Date(n.data+"T00:00:00"), fimD=new Date(n.ate+"T00:00:00"), linhas=[];

        var d=new Date(ini);

      } else {
        var passo=n.repetir==="diario"?1:n.repetir==="quinzenal"?14:7; var d2=new Date(ini);

        else { while(d2<=fimD){ linhas.push(Object.assign({},p,{data:fmtISO(d2),serie_id:serie})); d2.setDate(d2.getDate()+passo); } }
      }
      if(!linhas.length){toast("Nenhuma data gerada — confira os dias e o período.");return;}
      if(linhas.length>200){toast("São muitas ocorrências (>200). Reduza o período.");return;}
      var r0=await sb.from("eventos").insert(linhas);
      if(r0.error)toast(r0.error.message); else{setN(vazio);setAbrir(false);setEditId(null);carregar();toast("Série criada: "+linhas.length+" ocorrências 🔁");}
      return;
    }
    const r=editId?await sb.from("eventos").update(p).eq("id",editId):await sb.from("eventos").insert(p);
    if(r.error)toast(r.error.message); else{setN(vazio);setAbrir(false);setEditId(null);carregar();}

function Mercado(props){
  const toast=props.toast;
  const [tela,setTela]=useState("home");
  const [listas,setListas]=useState([]),[itens,setItens]=useState([]),[ativaId,setAtivaId]=useState(null);
  const [novaAberto,setNovaAberto]=useState(false),[nova,setNova]=useState({nome:"",mercado:"",orcamento:"",data:hojeLocal()});
  const [addAberto,setAddAberto]=useState(false),[busca,setBusca]=useState(""),[catAberta,setCatAberta]=useState("");
  const [ordem,setOrdem]=useState("categoria"),[lendo,setLendo]=useState(false),[resumo,setResumo]=useState(null);

  const carregar=async function(){
    const a=await sb.from("mercado_listas").select("*").order("criado_em",{ascending:false}); setListas(a.data||[]);
    const b=await sb.from("mercado_itens").select("*").order("criado_em"); setItens(b.data||[]);
  };
  useEffect(function(){carregar();const ch=sb.channel("merc").on("postgres_changes",{event:"*",schema:"public",table:"mercado_listas"},carregar).on("postgres_changes",{event:"*",schema:"public",table:"mercado_itens"},carregar).subscribe();return function(){sb.removeChannel(ch);};},[]);

  const fmtR=function(v){return "R$ "+(Math.round(Number(v||0)*100)/100).toFixed(2).replace(".",",");};
  const lista=listas.find(function(l){return l.id===ativaId;});
  const itensL=itens.filter(function(i){return i.lista_id===ativaId;});
  const catDe=function(nome){var achou="🛒 Mercearia";Object.keys(MERCADO_BASE).forEach(function(c){if(MERCADO_BASE[c].indexOf(nome)>=0)achou=c;});return achou;};

  async function criarLista(){ if(!nova.nome.trim()){toast("Dê um nome à lista.");return;}
    const r=await sb.from("mercado_listas").insert({nome:nova.nome,mercado:nova.mercado,orcamento:Number(nova.orcamento)||0,data:nova.data,status:"preparando",total:0}).select().single();
    if(r.error){toast(r.error.message);return;} setNova({nome:"",mercado:"",orcamento:"",data:hojeLocal()}); setNovaAberto(false); setAtivaId(r.data.id); setTela("lista"); carregar();
  }
  async function addItem(nome,cat){ if(!ativaId)return; if(itensL.some(function(i){return i.nome.toLowerCase()===nome.toLowerCase();})){toast(nome+" já está na lista.");return;}
    const r=await sb.from("mercado_itens").insert({lista_id:ativaId,nome:nome,categoria:cat||catDe(nome),qtd:1,unidade:"un",preco:null,comprado:false}); if(r.error)toast(r.error.message); else carregar();
  }
  async function addManual(){ if(!busca.trim())return; await addItem(busca.trim(),catDe(busca.trim())); setBusca(""); }
  async function updItem(id,campo,val){ var r=await sb.from("mercado_itens").update(campo).eq("id",id); if(r.error)toast(r.error.message); else carregar(); }
  async function delItem(id){ await sb.from("mercado_itens").delete().eq("id",id); carregar(); }
  async function delLista(id){ await sb.from("mercado_itens").delete().eq("lista_id",id); await sb.from("mercado_listas").delete().eq("id",id); if(ativaId===id){setAtivaId(null);setTela("home");} carregar(); }
  async function setStatus(st){ if(!lista)return; await sb.from("mercado_listas").update({status:st}).eq("id",lista.id); carregar(); }

  const totalComprado=function(its){var t=0;its.forEach(function(i){if(i.comprado&&i.preco)t+=Number(i.preco)*Number(i.qtd||1);});return t;};
  const totalG=totalComprado(itensL);

  async function finalizar(){ if(!lista)return; await sb.from("mercado_listas").update({status:"concluida",total:totalG,data:hojeLocal()}).eq("id",lista.id); setResumo({nome:lista.nome,mercado:lista.mercado,orc:orc,gasto:totalG,itens:compradosN,tot:itensL.length}); carregar(); }

  async function prepImg(file){const bmp=await createImageBitmap(file);const max=2000;let w=bmp.width,h=bmp.height;if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(bmp,0,0,w,h);const url=c.toDataURL("image/jpeg",0.9);return{base64:url.split(",")[1],mediaType:"image/jpeg"};}
  async function lerCupom(e){ const file=e.target.files&&e.target.files[0]; if(!file||!lista)return; setLendo(true);
    try{ const img=await prepImg(file); const r=await sb.functions.invoke("ler-cupom",{body:{imagem:img.base64,mediaType:img.mediaType}}); if(r.error)throw r.error; const d=r.data||{}; if(d.error)throw new Error(d.error);
      var upd={}; if(d.total)upd.total=Number(d.total); if(d.mercado&&!lista.mercado)upd.mercado=d.mercado; upd.status="concluida"; upd.data=hojeLocal();
      await sb.from("mercado_listas").update(upd).eq("id",lista.id);
      setResumo({nome:lista.nome,mercado:d.mercado||lista.mercado,orc:orc,gasto:d.total?Number(d.total):totalG,itens:compradosN,tot:itensL.length,nf:true}); carregar();
    }catch(err){ var em=String((err&&err.message)||err||""); if(em.indexOf("not found")>=0||em.indexOf("404")>=0||em.indexOf("Failed to send")>=0){toast("A função ler-cupom não foi encontrada no Supabase. Faça o deploy dela.");}else{toast("Não consegui ler o cupom: "+em.slice(0,90));} }
    finally{setLendo(false);e.target.value="";}

        </div>
        ${orc?html`<div style=${{height:8,background:"#F0EBE3",borderRadius:6,overflow:"hidden",marginTop:8}}><div style=${{width:pct+"%",height:"100%",borderRadius:6,background:estourou2?COR.meninas:pct>85?"#C99A2E":COR.pais}}></div></div>`:null}
        ${estourou2?html`<div className="note" style=${{color:COR.meninas,fontWeight:700,marginTop:6}}>⚠️ Orçamento estourado em ${fmtR(totalG-orc)}</div>`:null}

function Album(props){

  const codesDe=function(t){ if(t.c==="FWC"){var a=["00"];for(var i=1;i<=19;i++)a.push("FWC"+i);return a;} var b=[];for(var j=1;j<=20;j++)b.push(t.c+j);return b;};

  const qtdDe=function(c){return st[c]||0;};

  const tap=function(c){ var q=qtdDe(c); if(modo==="menos"){ if(q>0)setQtd(c,q-1); } else setQtd(c,q+1); };
  const prog=function(t){ var cs=codesDe(t),tem=0; cs.forEach(function(c){if(qtdDe(c)>=1)tem++;}); return {tem:tem,tot:cs.length}; };

  var totTem=0,totTot=0,totRep=0;
  SELECOES.forEach(function(t){ codesDe(t).forEach(function(c){ totTot++; var q=qtdDe(c); if(q>=1)totTem++; if(q>1)totRep+=q-1; }); });
  const listaFalt=function(){ var ls=[]; SELECOES.forEach(function(t){ var arr=codesDe(t).filter(function(c){return qtdDe(c)===0;}); if(arr.length)ls.push({t:t,arr:arr}); }); return ls; };
  const listaRep=function(){ var ls=[]; SELECOES.forEach(function(t){ var arr=codesDe(t).filter(function(c){return qtdDe(c)>1;}).map(function(c){return c+" ×"+(qtdDe(c)-1);}); if(arr.length)ls.push({t:t,arr:arr}); }); return ls; };
  async function exportar(){

  async function prepImg(file){const bmp=await createImageBitmap(file);const max=2400;let w=bmp.width,h=bmp.height;if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(bmp,0,0,w,h);const url=c.toDataURL("image/jpeg",0.92);return{base64:url.split(",")[1],mediaType:"image/jpeg"};}

    }catch(err){var em=String((err&&err.message)||err||"");if(em.indexOf("not found")>=0||em.indexOf("404")>=0||em.indexOf("Failed to send")>=0){toast("A função ler-album não foi encontrada no Supabase. Faça o deploy dela (Edge Functions).");}else{toast("Falha na leitura: "+(em.slice(0,120)||"tente foto mais de perto, com boa luz."));}}

/* ---- MOTOR DE QUIZ (serve para qualquer prova do catálogo) ---- */
function JogoQuiz(props){
  const jogo=props.jogo, crianca=props.crianca, onVoltar=props.onVoltar;
  const PERGUNTAS=jogo.perguntas, total=PERGUNTAS.length;
  const nome=(crianca&&crianca.nome)||"";
  const C=temaJogo(jogo.tema);

  function baralho(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t;} return a; }
  function preparar(){ return baralho(PERGUNTAS).map(function(p){ return { q:p.q, op:baralho(p.op.map(function(t,i){ return {t:t, ok:i===p.c}; })) }; }); }

  const [fase,setFase]=useState("inicio");
  const [lista,setLista]=useState([]);
  const [i,setI]=useState(0);
  const [pontos,setPontos]=useState(0);
  const [acertos,setAcertos]=useState(0);
  const [seq,setSeq]=useState(0);
  const [melhor,setMelhor]=useState(0);
  const [escolha,setEscolha]=useState(null);
  const [travado,setTravado]=useState(false);

  function iniciar(){ setLista(preparar()); setI(0); setPontos(0); setAcertos(0); setSeq(0); setMelhor(0); setEscolha(null); setTravado(false); setFase("jogo"); }
  function responder(k){
    if(travado) return; setTravado(true); setEscolha(k);
    const acertou=lista[i].op[k].ok;
    if(acertou){ const b=seq>=2?5:0; setPontos(function(p){return p+10+b;}); setAcertos(function(a){return a+1;}); setSeq(function(s){var n=s+1; setMelhor(function(m){return Math.max(m,n);}); return n;}); }
    else { setSeq(0); }
    setTimeout(function(){ if(i+1<total){ setI(function(n){return n+1;}); setEscolha(null); setTravado(false); } else { setFase("fim"); } }, 950);
  }

  const st={
    wrap:{maxWidth:480,margin:"0 auto",padding:16,fontFamily:"inherit",color:C.escuro},
    card:{background:C.creme,borderRadius:22,padding:"20px 16px",boxShadow:"0 10px 26px rgba(27,67,50,.14)",border:"3px solid #fff"},
    voltar:{background:"none",border:"none",color:C.terra,fontSize:15,cursor:"pointer",marginBottom:10},
    h1:{fontSize:24,color:C.acento,margin:"6px 0",textAlign:"center"},
    badge:{display:"inline-block",background:C.sol,color:C.corBtn==="#fff"?"#fff":"#7a5a00",fontWeight:"bold",fontSize:13,padding:"4px 12px",borderRadius:20},
    btn:{fontFamily:"inherit",fontSize:20,fontWeight:"bold",color:C.corBtn,background:C.sol,border:"none",borderRadius:18,padding:"14px 26px",cursor:"pointer",boxShadow:"0 6px 0 "+C.sombraBtn},
    topo:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,fontSize:15,fontWeight:"bold",color:C.terra},
    barra:{flex:1,height:14,background:"#e0e0d5",borderRadius:20,margin:"0 10px",overflow:"hidden",border:"2px solid #fff"},
    bola:{width:44,height:44,borderRadius:"50%",background:C.destaque,color:"#fff",fontWeight:"bold",fontSize:20,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 10px"},
    perg:{fontSize:18,lineHeight:1.3,textAlign:"center",margin:"4px 4px 16px"},
    estrelas:{fontSize:38,letterSpacing:4,textAlign:"center"},
    placar:{fontSize:40,color:C.acento,fontWeight:"bold",textAlign:"center",margin:"4px 0"},
    stats:{display:"flex",justifyContent:"center",gap:18,color:C.terra,fontSize:15,margin:"8px 0 14px",fontWeight:"bold"},
    msg:{fontSize:17,color:C.terra,margin:"6px 8px 16px",textAlign:"center"}
  };
  function opStyle(estado){ return {display:"flex",alignItems:"center",gap:12,width:"100%",textAlign:"left",fontFamily:"inherit",fontSize:17,color:C.escuro,cursor:travado?"default":"pointer",marginBottom:10,padding:"12px 14px",borderRadius:16,minWidth:0,boxSizing:"border-box",border:"3px solid "+(estado==="ok"?C.acento:estado==="erro"?C.destaque:C.clara),background:estado==="ok"?C.fundo:estado==="erro"?"#fde7ef":"#fff"}; }
  function letStyle(estado){ return {flex:"none",width:34,height:34,borderRadius:10,fontWeight:"bold",fontSize:18,display:"flex",alignItems:"center",justifyContent:"center",background:estado==="ok"?C.acento:estado==="erro"?C.destaque:C.fundo,color:estado==="neutra"?C.acento:"#fff"}; }
  const letras=["A","B","C","D"];
  const primeiroNome=nome?String(nome).trim().split(" ")[0]:"";

  if(fase==="inicio"){
    return html`<div style=${st.wrap}>
      <button style=${st.voltar} onClick=${onVoltar}>← Voltar</button>
      <div style=${{...st.card,textAlign:"center"}}>
        <div style=${{fontSize:48}}>${jogo.emoji||C.cabeca}</div>
        <h1 style=${st.h1}>${jogo.tit}</h1>
        <span style=${st.badge}>🎯 Nível ${jogo.nivel} · ${total} perguntas</span>
        <p style=${{color:C.terra,fontSize:16}}>${primeiroNome?("Bora, "+primeiroNome+"! "):"Bora! "}Cada acerto vale pontos, e sequência dá bônus! 🔥</p>
        <button style=${st.btn} onClick=${iniciar}>Começar 🚀</button>
      </div></div>`;
  }

  if(fase==="jogo"){
    const p=lista[i]; const prog=Math.round((i/total)*100);
    return html`<div style=${st.wrap}><div style=${st.card}>
      <div style=${st.topo}>
        <span>${C.cabeca} ${i+1}/${total}</span>
        <div style=${st.barra}><div style=${{height:"100%",width:prog+"%",background:"linear-gradient(90deg,"+C.clara+","+C.acento+")",borderRadius:20}}></div></div>
        <span>⭐ ${pontos}</span>
      </div>
      ${seq>=2 && html`<div style=${{textAlign:"center",color:C.destaque,fontWeight:"bold",marginBottom:6}}>🔥 Sequência de ${seq}!</div>`}
      <div style=${st.bola}>${i+1}</div>
      <p style=${st.perg}>${p.q}</p>
      ${p.op.map(function(o,k){
        let estado="neutra";
        if(travado){ if(o.ok) estado="ok"; else if(k===escolha) estado="erro"; }
        return html`<div key=${k} style=${opStyle(estado)} onClick=${function(){responder(k);}}>
          <span style=${letStyle(estado)}>${estado==="ok"?"✓":estado==="erro"?"✗":letras[k]}</span>
          <span style=${{minWidth:0}}>${o.t}</span></div>`;
      })}
    </div></div>`;
  }

  const pct=acertos/total;
  const estrelas=pct>=0.9?"⭐⭐⭐":pct>=0.6?"⭐⭐":pct>=0.3?"⭐":"🌱";
  const msg=pct>=0.9?("Incrível"+(primeiroNome?(", "+primeiroNome):"")+"! Você domina esse assunto! 🌳"):pct>=0.6?("Muito bem"+(primeiroNome?(", "+primeiroNome):"")+"! Jogada de expert! 🌻"):pct>=0.3?"Boa! Mais uma rodada e você sobe de nível! 🌱":"Toda semente cresce com o tempo 🌱 Bora de novo!";
  return html`<div style=${st.wrap}>
    <button style=${st.voltar} onClick=${onVoltar}>← Voltar</button>
    <div style=${st.card}>
      <div style=${st.estrelas}>${estrelas}</div>
      <div style=${st.placar}>${pontos} <span style=${{fontSize:20,color:C.terra}}>pontos</span></div>
      <div style=${st.stats}><span>✅ ${acertos}/${total}</span><span>🔥 melhor: ${melhor}</span></div>
      <p style=${st.msg}>${msg}</p>
      <div style=${{textAlign:"center"}}><button style=${st.btn} onClick=${iniciar}>Jogar de novo 🔁</button></div>
    </div></div>`;
}

            </div>

          <div style=${{fontSize:18,color:"#857A8C",flex:"none"}}>→</div>
        </button>`; })}
      </div>`}
    </div>`;
  }

  return html`<div className="wrap">
    <div className="eyebrow">Jogos Interativos</div>
    <div className="h1" style=${{marginBottom:4}}>🎮 Aprender jogando</div>

        <button className="btn btn-ghost" style=${{padding:"7px 12px",fontSize:13}} onClick=${function(){sb.auth.signOut();}}>Sair</button>
      </div>
      ${aba==="agenda"?html`<${Agenda} toast=${toast}/>`:aba==="painel"?html`<${Painel} papel=${papel} nome=${nome} albumAtivo=${albumAtivo} toggleAlbum=${toggleAlbum}/>`:aba==="album"?html`<${Album} papel=${papel} toast=${toast} toggleAlbum=${toggleAlbum}/>`:aba==="carteira"?html`<${Carteira} papel=${papel} nome=${nome} toast=${toast}/>`:aba==="mercado"?html`<${Mercado} toast=${toast}/>`:aba==="jogos"?html`<${Jogos} nome=${nome} papel=${papel} toast=${toast}/>`:html`<${Missoes} papel=${papel} nome=${nome} toast=${toast}/>`}
      <div className="tabs">
        <button className=${"tab"+(aba==="inicio"?" on":"")} onClick=${function(){setAba("inicio");}}>🏠<br/>Início</button>
        <button className=${"tab"+(aba==="agenda"?" on":"")} onClick=${function(){setAba("agenda");}}>📅<br/>Agenda</button>
        <button className=${"tab"+(aba==="missoes"?" on":"")} onClick=${function(){setAba("missoes");}}>✅<br/>Missões</button>
        <button className=${"tab"+(aba==="carteira"?" on":"")} onClick=${function(){setAba("carteira");}}>💰<br/>Carteira</button>
        <button className=${"tab"+(aba==="mercado"?" on":"")} onClick=${function(){setAba("mercado");}}>🛒<br/>Mercado</button>
        <button className=${"tab"+(aba==="jogos"?" on":"")} onClick=${function(){setAba("jogos");}}>🎮<br/>Jogos</button>
        ${albumAtivo?html`<button className=${"tab"+(aba==="album"?" on":"")} onClick=${function(){setAba("album");}}>⚽<br/>Álbum</button>`:null}
        ${(papel==="pai"||papel==="mae")?html`<button className=${"tab"+(aba==="painel"?" on":"")} onClick=${function(){setAba("painel");}}>📊<br/>Painel</button>`:null}
      </div>
      ${toastMsg?html`<div className="toast">${toastMsg}</div>`:null}
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
} catch(err){ window.__erros.push('App: '+(err&&err.message?err.message:err)); window.__banner&&window.__banner(); }
</script>
</body>
</html>
