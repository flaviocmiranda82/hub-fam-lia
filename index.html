const solicitarPermissaoNotificacoes=async function(){if(!("Notification" in window)){return false;}if(Notification.permission==="granted"){return true;}if(Notification.permission!=="denied"){const perm=await Notification.requestPermission();return perm==="granted";}return false;};

async function desenhar(ev){
  await (document.fonts?document.fonts.ready:Promise.resolve());
  const s=2,W=680,P=44,cor=ev.festa_infantil?COR.meninas:COR.pais,corBg=ev.festa_infantil?COR.meninasBg:COR.paisBg;

  const H=250+linhas.length*64,c=document.createElement("canvas");c.width=W*s;c.height=H*s;const x=c.getContext("2d");x.scale(s,s);
  const rr=(a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();};

  x.textBaseline="top";x.fillStyle="#857A8C";x.font="700 13px 'Space Mono',monospace";x.fillText("L E M B R E T E   •   F A M Í L I A",P,44);
  x.fillStyle="#2A2233";x.font="800 34px 'Bricolage Grotesque',sans-serif";
  const pal=(ev.titulo||"Evento").split(" ");let l1="",l2="";for(const p of pal){const t=(l1?l1+" ":"")+p;if(x.measureText(t).width<W-2*P-20&&!l2)l1=t;else l2=(l2?l2+" ":"")+p;}

function escICS(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");}
function icsData(d,t){const dd=String(d||"").replace(/-/g,"");if(!t)return dd;return dd+"T"+String(t).replace(":","")+"00";}
function maisUmaHora(t){const p=String(t).split(":");let h=Number(p[0]||0),m=Number(p[1]||0);h=(h+1)%24;return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");}
function proximoDia(d){const dt=new Date(d+"T00:00:00");dt.setDate(dt.getDate()+1);return dt.toISOString().slice(0,10);}
function baixarICS(ev){
  const stamp=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const temHora=!!ev.inicio;
  let dtStart,dtEnd;
  if(ev.tipo==="viagem"&&ev.data_fim){dtStart="DTSTART;VALUE=DATE:"+icsData(ev.data,"");dtEnd="DTEND;VALUE=DATE:"+icsData(proximoDia(ev.data_fim),"");}
  else if(temHora){dtStart="DTSTART:"+icsData(ev.data,ev.inicio);const fim=ev.fim||maisUmaHora(ev.inicio);dtEnd="DTEND:"+icsData(ev.data,fim);}
  else{dtStart="DTSTART;VALUE=DATE:"+icsData(ev.data,"");dtEnd="DTEND;VALUE=DATE:"+icsData(proximoDia(ev.data),"");}
  const linhas=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Hub da Familia//PT-BR","CALSCALE:GREGORIAN","BEGIN:VEVENT","UID:"+(ev.id||Date.now())+"@hubfamilia","DTSTAMP:"+stamp,dtStart,dtEnd,"SUMMARY:"+escICS(ev.titulo),ev.local?"LOCATION:"+escICS(ev.local):"",ev.convidado?"DESCRIPTION:"+escICS("Aniversariante/convidado: "+ev.convidado):"","END:VEVENT","END:VCALENDAR"].filter(Boolean);
  const ics=linhas.join("\r\n");
  const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=(ev.titulo||"evento").replace(/[^a-z0-9]/gi,"_")+".ics";
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1500);
}

function semAcento(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
function sugerirCat(desc){var d=" "+semAcento(desc)+" ";for(var i=0;i<REGRAS_CAT.length;i++){var r=REGRAS_CAT[i];for(var j=0;j<r[1].length;j++){if(d.indexOf(r[1][j])>=0)return r[0];}}return CAT_PEND;}

function lerOFX(txt){
  var out=[];
  txt.split(/<STMTTRN>/i).slice(1).forEach(function(b){
    b=b.split(/<\/STMTTRN>/i)[0];
    var g=function(t){var m=b.match(new RegExp("<"+t+">([^<\\r\\n]*)","i"));return m?m[1].trim():"";};
    var v=numBR(g("TRNAMT")), d=dataBR(g("DTPOSTED"));
    if(!isFinite(v)||v===0||!d)return;

  });

  if(lb){var ba=lb[1].match(/<BALAMT>([^<\r\n]*)/i),dt=lb[1].match(/<DTASOF>([^<\r\n]*)/i);if(ba&&isFinite(numBR(ba[1])))saldo={valor:numBR(ba[1]),data:dt?dataBR(dt[1]):null};}

function splitLinha(l,sep){var out=[],cur="",q=false;for(var i=0;i<l.length;i++){var c=l[i];if(c==='"'){if(q&&l[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(c===sep&&!q){out.push(cur);cur="";}else cur+=c;}out.push(cur);return out.map(function(x){return x.trim();});}
function lerCSV(txt){
  var linhas=txt.replace(/^﻿/,"").split(/\r?\n/);
  var sep=(txt.split(";").length>=txt.split(",").length)?";":",";
  var hi=-1,cols=null,saldo=null;
  for(var i=0;i<linhas.length;i++){
    var c=splitLinha(linhas[i],sep).map(semAcento);
    if(c.some(function(x){return x.indexOf("data")===0;})&&c.some(function(x){return x.indexOf("valor")===0;})){hi=i;cols=c;break;}
    if(c[0]&&c[0].indexOf("saldo")===0&&c[1]&&isFinite(numBR(c[1])))saldo={valor:numBR(c[1]),data:null};
  }
  if(hi<0)throw new Error("Não achei o cabeçalho com as colunas Data e Valor.");
  var iD=cols.findIndex(function(x){return x.indexOf("data")===0;}), iV=cols.findIndex(function(x){return x.indexOf("valor")===0;});
  var iDs=[];cols.forEach(function(x,k){if(x.indexOf("descri")>=0||x.indexOf("hist")>=0||x.indexOf("lancamento")===0||x.indexOf("estabelec")>=0)iDs.push(k);});
  var out=[];
  for(var r=hi+1;r<linhas.length;r++){
    if(!linhas[r].trim())continue;
    var c2=splitLinha(linhas[r],sep), d=dataBR(c2[iD]), v=numBR(c2[iV]);
    if(!d||!isFinite(v)||v===0)continue;
    var ds=iDs.map(function(k){return c2[k]||"";}).filter(Boolean).join(" · ");
    out.push({data:d,valor:v,descricao:desEnt(ds||"Lançamento")});
  }
  return {trs:out,saldo:saldo};
}

function lerExtrato(txt){var t=/<OFX>|<STMTTRN>/i.test(txt)?lerOFX(txt):lerCSV(txt);if(!t.trs.length)throw new Error("Nenhum lançamento encontrado no arquivo.");return t;}

function Album(props){

  const qtdDe=function(c){return st[c]||0;};
  const setQtd=async function(c,q){ var m=Object.assign({},st);m[c]=q;setSt(m); var r=await sb.from("album_status").upsert({codigo:c,qtd:q}); if(r.error){toast(r.error.message);carregar();} };

        </div>

/* ---- MOTOR DE QUIZ (serve para qualquer prova do catálogo) ---- */
function JogoQuiz(props){
  const jogo=props.jogo, crianca=props.crianca, onVoltar=props.onVoltar;
  const PERGUNTAS=jogo.perguntas, total=PERGUNTAS.length;
  const nome=(crianca&&crianca.nome)||"";
  const C=temaJogo(jogo.tema);

  function baralho(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t;} return a; }
  function preparar(){ return baralho(PERGUNTAS).map(function(p){ return { q:p.q, op:baralho(p.op.map(function(t,i){ return {t:t, ok:i===p.c}; })) }; }); }

  const [fase,setFase]=useState("inicio");
  const [lista,setLista]=useState([]);
  const [i,setI]=useState(0);
  const [pontos,setPontos]=useState(0);
  const [acertos,setAcertos]=useState(0);
  const [seq,setSeq]=useState(0);
  const [melhor,setMelhor]=useState(0);
  const [escolha,setEscolha]=useState(null);
  const [travado,setTravado]=useState(false);

  function iniciar(){ setLista(preparar()); setI(0); setPontos(0); setAcertos(0); setSeq(0); setMelhor(0); setEscolha(null); setTravado(false); setFase("jogo"); }
  function responder(k){
    if(travado) return; setTravado(true); setEscolha(k);
    const acertou=lista[i].op[k].ok;
    if(acertou){ const b=seq>=2?5:0; setPontos(function(p){return p+10+b;}); setAcertos(function(a){return a+1;}); setSeq(function(s){var n=s+1; setMelhor(function(m){return Math.max(m,n);}); return n;}); }
    else { setSeq(0); }
    setTimeout(function(){ if(i+1<total){ setI(function(n){return n+1;}); setEscolha(null); setTravado(false); } else { setFase("fim"); } }, 950);
  }

  const st={
    wrap:{maxWidth:480,margin:"0 auto",padding:16,fontFamily:"inherit",color:C.escuro},
    card:{background:C.creme,borderRadius:22,padding:"20px 16px",boxShadow:"0 10px 26px rgba(27,67,50,.14)",border:"3px solid #fff"},
    voltar:{background:"none",border:"none",color:C.terra,fontSize:15,cursor:"pointer",marginBottom:10},
    h1:{fontSize:24,color:C.acento,margin:"6px 0",textAlign:"center"},
    badge:{display:"inline-block",background:C.sol,color:C.corBtn==="#fff"?"#fff":"#7a5a00",fontWeight:"bold",fontSize:13,padding:"4px 12px",borderRadius:20},
    btn:{fontFamily:"inherit",fontSize:20,fontWeight:"bold",color:C.corBtn,background:C.sol,border:"none",borderRadius:18,padding:"14px 26px",cursor:"pointer",boxShadow:"0 6px 0 "+C.sombraBtn},
    topo:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,fontSize:15,fontWeight:"bold",color:C.terra},
    barra:{flex:1,height:14,background:"#e0e0d5",borderRadius:20,margin:"0 10px",overflow:"hidden",border:"2px solid #fff"},
    bola:{width:44,height:44,borderRadius:"50%",background:C.destaque,color:"#fff",fontWeight:"bold",fontSize:20,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 10px"},
    perg:{fontSize:18,lineHeight:1.3,textAlign:"center",margin:"4px 4px 16px"},
    estrelas:{fontSize:38,letterSpacing:4,textAlign:"center"},
    placar:{fontSize:40,color:C.acento,fontWeight:"bold",textAlign:"center",margin:"4px 0"},
    stats:{display:"flex",justifyContent:"center",gap:18,color:C.terra,fontSize:15,margin:"8px 0 14px",fontWeight:"bold"},
    msg:{fontSize:17,color:C.terra,margin:"6px 8px 16px",textAlign:"center"}
  };
  function opStyle(estado){ return {display:"flex",alignItems:"center",gap:12,width:"100%",textAlign:"left",fontFamily:"inherit",fontSize:17,color:C.escuro,cursor:travado?"default":"pointer",marginBottom:10,padding:"12px 14px",borderRadius:16,minWidth:0,boxSizing:"border-box",border:"3px solid "+(estado==="ok"?C.acento:estado==="erro"?C.destaque:C.clara),background:estado==="ok"?C.fundo:estado==="erro"?"#fde7ef":"#fff"}; }
  function letStyle(estado){ return {flex:"none",width:34,height:34,borderRadius:10,fontWeight:"bold",fontSize:18,display:"flex",alignItems:"center",justifyContent:"center",background:estado==="ok"?C.acento:estado==="erro"?C.destaque:C.fundo,color:estado==="neutra"?C.acento:"#fff"}; }
  const letras=["A","B","C","D"];
  const primeiroNome=nome?String(nome).trim().split(" ")[0]:"";

  if(fase==="inicio"){
    return html`<div style=${st.wrap}>
      <button style=${st.voltar} onClick=${onVoltar}>← Voltar</button>
      <div style=${{...st.card,textAlign:"center"}}>
        <div style=${{fontSize:48}}>${jogo.emoji||C.cabeca}</div>
        <h1 style=${st.h1}>${jogo.tit}</h1>
        <span style=${st.badge}>🎯 Nível ${jogo.nivel} · ${total} perguntas</span>
        <p style=${{color:C.terra,fontSize:16}}>${primeiroNome?("Bora, "+primeiroNome+"! "):"Bora! "}Cada acerto vale pontos, e sequência dá bônus! 🔥</p>
        <button style=${st.btn} onClick=${iniciar}>Começar 🚀</button>
      </div></div>`;
  }

  if(fase==="jogo"){
    const p=lista[i]; const prog=Math.round((i/total)*100);
    return html`<div style=${st.wrap}><div style=${st.card}>
      <div style=${st.topo}>
        <span>${C.cabeca} ${i+1}/${total}</span>
        <div style=${st.barra}><div style=${{height:"100%",width:prog+"%",background:"linear-gradient(90deg,"+C.clara+","+C.acento+")",borderRadius:20}}></div></div>
        <span>⭐ ${pontos}</span>
      </div>
      ${seq>=2 && html`<div style=${{textAlign:"center",color:C.destaque,fontWeight:"bold",marginBottom:6}}>🔥 Sequência de ${seq}!</div>`}
      <div style=${st.bola}>${i+1}</div>
      <p style=${st.perg}>${p.q}</p>
      ${p.op.map(function(o,k){
        let estado="neutra";
        if(travado){ if(o.ok) estado="ok"; else if(k===escolha) estado="erro"; }
        return html`<div key=${k} style=${opStyle(estado)} onClick=${function(){responder(k);}}>
          <span style=${letStyle(estado)}>${estado==="ok"?"✓":estado==="erro"?"✗":letras[k]}</span>
          <span style=${{minWidth:0}}>${o.t}</span></div>`;
      })}
    </div></div>`;
  }

  const pct=acertos/total;
  const estrelas=pct>=0.9?"⭐⭐⭐":pct>=0.6?"⭐⭐":pct>=0.3?"⭐":"🌱";
  const msg=pct>=0.9?("Incrível"+(primeiroNome?(", "+primeiroNome):"")+"! Você domina esse assunto! 🌳"):pct>=0.6?("Muito bem"+(primeiroNome?(", "+primeiroNome):"")+"! Jogada de expert! 🌻"):pct>=0.3?"Boa! Mais uma rodada e você sobe de nível! 🌱":"Toda semente cresce com o tempo 🌱 Bora de novo!";
  return html`<div style=${st.wrap}>
    <button style=${st.voltar} onClick=${onVoltar}>← Voltar</button>
    <div style=${st.card}>
      <div style=${st.estrelas}>${estrelas}</div>
      <div style=${st.placar}>${pontos} <span style=${{fontSize:20,color:C.terra}}>pontos</span></div>
      <div style=${st.stats}><span>✅ ${acertos}/${total}</span><span>🔥 melhor: ${melhor}</span></div>
      <p style=${st.msg}>${msg}</p>
      <div style=${{textAlign:"center"}}><button style=${st.btn} onClick=${iniciar}>Jogar de novo 🔁</button></div>
    </div></div>`;
}

function parseProvaTxt(txt){
  var linhas=String(txt||"").split(/\r?\n/);
  var titulo="", materiaGlobal="", materiaAtual="", temQuestao=false;
  var perguntas=[], atual=null, erros=[];
  function fecha(){
    if(!atual) return;
    if(atual.op.length<2){ erros.push("“"+atual.q.slice(0,32)+"”: precisa de pelo menos 2 alternativas."); }
    else if(atual.c<0){ erros.push("“"+atual.q.slice(0,32)+"”: nenhuma alternativa marcada com *."); }
    else { perguntas.push({q:atual.q, op:atual.op.slice(), c:atual.c, materia:atual.materia||"", exp:atual.exp||""}); }
    atual=null;
  }
  for(var idx=0; idx<linhas.length; idx++){
    var l=linhas[idx].trim(); if(!l) continue;
    var low=l.toLowerCase();
    if(low.indexOf("prova:")===0){ titulo=l.slice(l.indexOf(":")+1).trim(); continue; }
    if(low.indexOf("materia:")===0 || low.indexOf("matéria:")===0){ var m=l.slice(l.indexOf(":")+1).trim(); materiaAtual=m; if(!perguntas.length && !atual) materiaGlobal=m; continue; }
    if(low.indexOf("p:")===0){ fecha(); temQuestao=true; atual={q:l.slice(l.indexOf(":")+1).trim(), op:[], c:-1, materia:materiaAtual||materiaGlobal, exp:""}; continue; }
    if(low.indexOf("explicacao:")===0 || low.indexOf("explicação:")===0){ if(atual) atual.exp=l.slice(l.indexOf(":")+1).trim(); continue; }
    if(l.charAt(0)==="-"){ if(!atual) continue; var t=l.slice(1).trim(); var ok=false; if(/\*\s*$/.test(t)){ ok=true; t=t.replace(/\*\s*$/,"").trim(); } if(ok && atual.c<0) atual.c=atual.op.length; atual.op.push(t); continue; }
  }
  fecha();
  if(!temQuestao) erros.push("Não encontrei nenhuma pergunta. Cada pergunta começa com “P:”.");
  return {titulo:titulo, materia:materiaGlobal, perguntas:perguntas, erros:erros};
}

  caca_id uuid not null references public.cacas_tesouro(id) on delete cascade,
  grupo_id uuid not null references public.ct_grupos(id) on delete cascade,
  ordem int not null,
  dica text not null,
  codigo text not null,
  foto_original_url text,
  foto_anime_url text,
  unique(grupo_id, ordem)
);
alter table public.ct_etapas enable row level security;
create policy "ct etapas todos" on public.ct_etapas
  for all to authenticated using (true) with check (true);

create table if not exists public.ct_tentativas (
  id uuid primary key default gen_random_uuid(),
  criado_em timestamptz not null default now(),
  caca_id uuid not null references public.cacas_tesouro(id) on delete cascade,
  grupo_id uuid not null references public.ct_grupos(id) on delete cascade,
  codigo_tentado text not null,
  sucesso boolean not null
);
alter table public.ct_tentativas enable row level security;
create policy "ct tentativas todos" on public.ct_tentativas
  for all to authenticated using (true) with check (true);

insert into storage.buckets (id, name, public)
values ('ct-fotos','ct-fotos', true)
on conflict (id) do nothing;

create policy "ct fotos leitura publica" on storage.objects
  for select using (bucket_id = 'ct-fotos');
create policy "ct fotos upload autenticado" on storage.objects
  for insert to authenticated with check (bucket_id = 'ct-fotos');
create policy "ct fotos update autenticado" on storage.objects
  for update to authenticated using (bucket_id = 'ct-fotos');
create policy "ct fotos delete autenticado" on storage.objects
  for delete to authenticated using (bucket_id = 'ct-fotos');`;


function Buraco(props){
  const toast=props.toast||function(){};
  const ehPai=(props.papel==="pai"||props.papel==="mae");
  const [vista,setVista]=useState("lista");        // "lista" | "novo" | "jogo"
  const [jogos,setJogos]=useState([]);
  const [atual,setAtual]=useState(null);           // linha do supabase em andamento
  const [carregando,setCarregando]=useState(true);
  const [semTabela,setSemTabela]=useState(false);
  // formulário de novo jogo
  const [meta,setMeta]=useState(3000);
  const [duplas,setDuplas]=useState([{id:"d1",nome:"Nós",jog:""},{id:"d2",nome:"Eles",jog:""}]);
  // registro de mão
  const [entrada,setEntrada]=useState({});         // {duplaId:"pontos"}
  const [calcOn,setCalcOn]=useState("");           // duplaId com a calculadora aberta
  const [calc,setCalc]=useState({});               // estado da calculadora
  const [editMao,setEditMao]=useState(null);       // índice da mão em edição

  const VAL={limpa:200,suja:100,bater:100,morto:100};

  const carregar=async function(){
    setCarregando(true);
    var r=await sb.from("buraco_partidas").select("*").order("criado_em",{ascending:false});
    if(r.error){ setCarregando(false); if((r.error.message||"").indexOf("buraco_partidas")>=0||r.error.code==="42P01"){setSemTabela(true);} else {toast(r.error.message);} return; }
    setJogos(r.data||[]); setSemTabela(false); setCarregando(false);
  };
  useEffect(function(){ carregar(); },[]);

  // ---------- pontuação ----------
  function totais(jogo){ var t={}; (jogo.estado.duplas||[]).forEach(function(d){t[d.id]=0;}); (jogo.estado.maos||[]).forEach(function(m){ Object.keys(m.pontos||{}).forEach(function(k){ t[k]=(t[k]||0)+(Number(m.pontos[k])||0); }); }); return t; }
  function lider(jogo){ var t=totais(jogo),mx=-1e12,quem=null,emp=false; Object.keys(t).forEach(function(k){ if(t[k]>mx){mx=t[k];quem=k;emp=false;} else if(t[k]===mx){emp=true;} }); return {quem:quem,pontos:mx,empate:emp}; }
  function venceu(jogo){ var l=lider(jogo); return (l.pontos>=(jogo.estado.meta||3000) && !l.empate)?l.quem:null; }
  function nomeDupla(jogo,id){ var d=(jogo.estado.duplas||[]).find(function(x){return x.id===id;}); return d?d.nome:"?"; }

  // ---------- persistência ----------
  async function persistir(row,novoEstado,patch){
    var upd=Object.assign({estado:novoEstado},patch||{});
    var r=await sb.from("buraco_partidas").update(upd).eq("id",row.id).select().single();
    if(r.error){toast(r.error.message);return null;}
    setAtual(r.data); setJogos(function(js){return js.map(function(j){return j.id===r.data.id?r.data:j;});});
    return r.data;
  }

  async function criarJogo(){
    var ds=duplas.filter(function(d){return (d.nome||"").trim();}).map(function(d,i){ return {id:d.id||("d"+(i+1)), nome:d.nome.trim(), jogadores:(d.jog||"").split(",").map(function(s){return s.trim();}).filter(Boolean)}; });
    if(ds.length<2){toast("Cadastre pelo menos 2 duplas.");return;}
    var estado={meta:Number(meta)||3000, duplas:ds, maos:[]};
    var r=await sb.from("buraco_partidas").insert({titulo:ds.map(function(d){return d.nome;}).join(" × "),status:"ativo",vencedor:null,estado:estado}).select().single();
    if(r.error){toast(r.error.message);return;}
    setAtual(r.data); setEntrada({}); setVista("jogo"); carregar(); toast("Jogo criado 🃏");
  }

  function abrir(j){ setAtual(j); setEntrada({}); setEditMao(null); setCalcOn(""); setVista("jogo"); }

  async function registrarMao(){
    if(!atual)return;
    var pontos={}; (atual.estado.duplas||[]).forEach(function(d){ pontos[d.id]=Math.round(Number(entrada[d.id])||0); });
    var maos=(atual.estado.maos||[]).slice();
    if(editMao!==null){ maos[editMao]=Object.assign({},maos[editMao],{pontos:pontos}); }
    else { maos.push({pontos:pontos, ts:Date.now()}); }
    var novo=Object.assign({},atual.estado,{maos:maos});
    var vt=venceu({estado:novo}); var patch={};
    var salvo=await persistir(atual,novo,patch);
    if(salvo){ setEntrada({}); setEditMao(null); setCalcOn(""); toast(editMao!==null?"Mão atualizada":"Mão registrada ✍️"); }
  }

  function carregarMaoParaEdicao(idx){ var m=(atual.estado.maos||[])[idx]; var e={}; (atual.estado.duplas||[]).forEach(function(d){ e[d.id]=String(m.pontos[d.id]!=null?m.pontos[d.id]:""); }); setEntrada(e); setEditMao(idx); window.scrollTo(0,0); }
  async function apagarMao(idx){ if(!window.confirm("Apagar esta mão?"))return; var maos=(atual.estado.maos||[]).slice(); maos.splice(idx,1); await persistir(atual,Object.assign({},atual.estado,{maos:maos})); toast("Mão apagada"); }
  async function encerrar(){ var v=venceu(atual)||lider(atual).quem; await persistir(atual,atual.estado,{status:"encerrado",vencedor:v}); toast("Jogo encerrado 🏁"); }
  async function reabrir(){ await persistir(atual,atual.estado,{status:"ativo",vencedor:null}); toast("Jogo reaberto"); }
  async function apagarJogo(id){ if(!window.confirm("Apagar este jogo e todo o histórico dele?"))return; var r=await sb.from("buraco_partidas").delete().eq("id",id); if(r.error){toast(r.error.message);return;} if(atual&&atual.id===id){setAtual(null);setVista("lista");} carregar(); toast("Jogo apagado"); }

  // ---------- calculadora assistida ----------
  function calcSub(c){ c=c||{}; return (Number(c.limpas)||0)*VAL.limpa + (Number(c.sujas)||0)*VAL.suja + (c.bater?VAL.bater:0) - (c.semMorto?VAL.morto:0) + (Number(c.cartasMais)||0) - (Number(c.cartasMenos)||0); }
  function setCalcCampo(did,campo,valor){ setCalc(function(cc){ var n=Object.assign({},cc); n[did]=Object.assign({},n[did]||{}); n[did][campo]=valor; return n; }); }
  function aplicarCalc(did){ var v=calcSub(calc[did]); setEntrada(function(e){var n=Object.assign({},e);n[did]=String(v);return n;}); setCalcOn(""); }

  // ---------- formulário de duplas (novo jogo) ----------
  function upDupla(i,campo,v){ setDuplas(function(ds){var n=ds.slice();n[i]=Object.assign({},n[i],{[campo]:v});return n;}); }
  function addDupla(){ setDuplas(function(ds){ if(ds.length>=4)return ds; return ds.concat([{id:"d"+(ds.length+1),nome:"Dupla "+(ds.length+1),jog:""}]); }); }
  function rmDupla(i){ setDuplas(function(ds){ if(ds.length<=2)return ds; return ds.filter(function(_,ix){return ix!==i;}); }); }

  // =========================================================
  if(carregando) return html`<div className="wrap"><div className="note">Carregando…</div></div>`;

  if(semTabela) return html`<div className="wrap">
    <button className="btn btn-ghost" style=${{padding:"7px 12px",fontSize:13,marginBottom:14}} onClick=${props.onSair}>← Jogos</button>
    <div className="eyebrow">Placar de Buraco</div>
    <div className="h1" style=${{marginBottom:6}}>🃏 Falta criar a tabela</div>
    <div className="card" style=${{padding:16}}>
      <div className="note" style=${{marginBottom:10}}>Rode este SQL no painel do Supabase (uma vez só) para ativar o placar:</div>
      <pre style=${{whiteSpace:"pre-wrap",fontSize:11.5,fontFamily:"monospace",background:"#F6F1E9",padding:12,borderRadius:10,overflow:"auto"}}>${SQL_BURACO}</pre>
      <button className="btn btn-primary" style=${{marginTop:12}} onClick=${carregar}>Já rodei — recarregar</button>
    </div>
  </div>`;

  // ---------- NOVO JOGO ----------
  if(vista==="novo") return html`<div className="wrap">
    <button className="btn btn-ghost" style=${{padding:"7px 12px",fontSize:13,marginBottom:14}} onClick=${function(){setVista("lista");}}>← Voltar</button>
    <div className="eyebrow">Novo jogo</div>
    <div className="h1" style=${{marginBottom:14}}>🃏 Montar a mesa</div>

    <div className="card" style=${{padding:14,marginBottom:12}}>
      <span className="label">Meta (pontos para vencer)</span>
      <div style=${{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
        ${[1500,2000,3000].map(function(v){return html`<button key=${v} className=${"fchip"+(Number(meta)===v?" on":"")} onClick=${function(){setMeta(v);}}>${v}</button>`;})}
      </div>
      <input className="input" type="number" value=${meta} onChange=${function(e){setMeta(e.target.value);}}/>
    </div>

    <div className="eyebrow" style=${{marginBottom:8}}>Duplas</div>
    <div style=${{display:"flex",flexDirection:"column",gap:10}}>
      ${duplas.map(function(d,i){return html`<div key=${i} className="card" style=${{padding:12}}>
        <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span className="label" style=${{margin:0}}>Dupla ${i+1}</span>
          ${duplas.length>2?html`<button onClick=${function(){rmDupla(i);}} style=${{border:"none",background:"none",color:"#C64B33",fontSize:14,cursor:"pointer"}}>remover</button>`:null}
        </div>
        <input className="input" style=${{marginBottom:8}} placeholder="Nome da dupla" value=${d.nome} onChange=${function(e){upDupla(i,"nome",e.target.value);}}/>
        <input className="input" placeholder="Jogadores (separados por vírgula)" value=${d.jog} onChange=${function(e){upDupla(i,"jog",e.target.value);}}/>
      </div>`;})}
    </div>
    ${duplas.length<4?html`<button className="btn btn-ghost" style=${{width:"100%",marginTop:10}} onClick=${addDupla}>+ Adicionar dupla</button>`:null}
    <button className="btn btn-primary" style=${{marginTop:14}} onClick=${criarJogo}>Começar jogo</button>
  </div>`;

  // ---------- JOGO EM ANDAMENTO ----------
  if(vista==="jogo" && atual){
    var t=totais(atual); var l=lider(atual); var venc=atual.vencedor||venceu(atual); var metaJ=atual.estado.meta||3000; var encerrado=atual.status==="encerrado";
    var ordenadas=(atual.estado.duplas||[]).slice().sort(function(a,b){return (t[b.id]||0)-(t[a.id]||0);});
    return html`<div className="wrap">
      <button className="btn btn-ghost" style=${{padding:"7px 12px",fontSize:13,marginBottom:12}} onClick=${function(){setVista("lista");setAtual(null);}}>← Jogos salvos</button>
      <div className="eyebrow">${encerrado?"Jogo encerrado":"Em andamento"} · meta ${metaJ}</div>
      <div className="h1" style=${{marginBottom:4,fontSize:24}}>${atual.titulo}</div>

      ${venc?html`<div className="card" style=${{padding:"14px 16px",margin:"12px 0",background:"linear-gradient(135deg,#FDEEE9,#E7F2F0)",display:"flex",alignItems:"center",gap:10}}>
        <div style=${{fontSize:26}}>🏆</div><div><div style=${{fontWeight:800}}>${nomeDupla(atual,venc)} venceu!</div><div className="note">${t[venc]} pontos · meta ${metaJ}</div></div>
      </div>`:null}

      <!-- placar -->
      <div style=${{display:"flex",flexDirection:"column",gap:10,margin:"14px 0"}}>
        ${ordenadas.map(function(d){ var pct=Math.max(0,Math.min(100,Math.round(((t[d.id]||0)/metaJ)*100))); var isL=(l.quem===d.id&&!l.empate&&(atual.estado.maos||[]).length>0);
          return html`<div key=${d.id} className="card" style=${{padding:"13px 15px",borderColor:isL?"#2E8B83":"#ECE3D8",borderWidth:isL?2:1}}>
          <div style=${{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8}}>
            <div style=${{minWidth:0}}><div style=${{fontWeight:800,fontSize:16}}>${isL?"👑 ":""}${d.nome}</div>${d.jogadores&&d.jogadores.length?html`<div className="note" style=${{fontSize:11.5}}>${d.jogadores.join(" · ")}</div>`:null}</div>
            <div style=${{fontFamily:"'Bricolage Grotesque',sans-serif",fontWeight:800,fontSize:26,flex:"none"}}>${t[d.id]||0}</div>
          </div>
          <div style=${{height:7,background:"#F0EBE3",borderRadius:99,marginTop:9,overflow:"hidden"}}><div style=${{height:"100%",width:pct+"%",background:isL?"#2E8B83":"#B8AEC4",borderRadius:99}}></div></div>
        </div>`; })}
      </div>

      <!-- registrar mão -->
      ${!encerrado?html`<div className="card" style=${{padding:14,marginBottom:14}}>
        <div style=${{fontWeight:700,marginBottom:2}}>${editMao!==null?"✏️ Editar mão "+(editMao+1):"✍️ Registrar mão "+((atual.estado.maos||[]).length+1)}</div>
        <div className="note" style=${{marginBottom:10}}>Digite o total de cada dupla, ou toque em 🧮 para somar canastras e cartas.</div>
        <div style=${{display:"flex",flexDirection:"column",gap:10}}>
          ${(atual.estado.duplas||[]).map(function(d){ return html`<div key=${d.id}>
            <div style=${{display:"flex",gap:8,alignItems:"center"}}>
              <div style=${{flex:1,minWidth:0}}><span className="label">${d.nome}</span><input className="input" type="number" value=${entrada[d.id]!=null?entrada[d.id]:""} placeholder="0" onChange=${function(e){var v=e.target.value;setEntrada(function(x){var n=Object.assign({},x);n[d.id]=v;return n;});}}/></div>
              <button className="btn btn-ghost" style=${{flex:"none",padding:"11px 13px",marginTop:16}} onClick=${function(){setCalcOn(calcOn===d.id?"":d.id);}}>🧮</button>
            </div>
            ${calcOn===d.id?html`<div style=${{marginTop:8,padding:12,borderRadius:12,background:"#F6F1E9"}}>
              <div style=${{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                <div><span className="label">Canastras limpas (×200)</span><input className="input" type="number" value=${(calc[d.id]||{}).limpas||""} onChange=${function(e){setCalcCampo(d.id,"limpas",e.target.value);}}/></div>
                <div><span className="label">Canastras sujas (×100)</span><input className="input" type="number" value=${(calc[d.id]||{}).sujas||""} onChange=${function(e){setCalcCampo(d.id,"sujas",e.target.value);}}/></div>
                <div><span className="label">Cartas baixadas (+)</span><input className="input" type="number" value=${(calc[d.id]||{}).cartasMais||""} onChange=${function(e){setCalcCampo(d.id,"cartasMais",e.target.value);}}/></div>
                <div><span className="label">Cartas na mão (−)</span><input className="input" type="number" value=${(calc[d.id]||{}).cartasMenos||""} onChange=${function(e){setCalcCampo(d.id,"cartasMenos",e.target.value);}}/></div>
              </div>
              <div style=${{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>
                <button className=${"fchip"+((calc[d.id]||{}).bater?" on":"")} onClick=${function(){setCalcCampo(d.id,"bater",!(calc[d.id]||{}).bater);}}>Bateu (+100)</button>
                <button className=${"fchip"+((calc[d.id]||{}).semMorto?" on":"")} onClick=${function(){setCalcCampo(d.id,"semMorto",!(calc[d.id]||{}).semMorto);}}>Não pegou o morto (−100)</button>
              </div>
              <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10}}>
                <div style=${{fontWeight:800,fontSize:18}}>${calcSub(calc[d.id])} pts</div>
                <button className="btn btn-primary" style=${{width:"auto",padding:"9px 14px"}} onClick=${function(){aplicarCalc(d.id);}}>Aplicar</button>
              </div>
            </div>`:null}
          </div>`; })}
        </div>
        <div style=${{display:"flex",gap:8,marginTop:12}}>
          <button className="btn btn-primary" style=${{flex:1}} onClick=${registrarMao}>${editMao!==null?"Salvar alteração":"Adicionar mão"}</button>
          ${editMao!==null?html`<button className="btn btn-ghost" onClick=${function(){setEntrada({});setEditMao(null);setCalcOn("");}}>Cancelar</button>`:null}
        </div>
      </div>`:null}

      <!-- histórico de mãos -->
      ${(atual.estado.maos||[]).length?html`<div style=${{marginBottom:16}}>
        <div className="eyebrow" style=${{marginBottom:8}}>Mãos jogadas</div>
        <div style=${{display:"flex",flexDirection:"column",gap:6}}>
          ${(atual.estado.maos||[]).map(function(m,idx){ return html`<div key=${idx} className="card" style=${{padding:"10px 12px"}}>
            <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span className="chip" style=${{background:"#F0EBE3",color:"#6b6270"}}>Mão ${idx+1}</span>
              ${!encerrado?html`<div style=${{display:"flex",gap:12}}><button onClick=${function(){carregarMaoParaEdicao(idx);}} style=${{border:"none",background:"none",cursor:"pointer",fontSize:13,color:"#2E8B83",fontWeight:600}}>editar</button><button onClick=${function(){apagarMao(idx);}} style=${{border:"none",background:"none",cursor:"pointer",fontSize:14,color:"#C64B33"}}>🗑</button></div>`:null}
            </div>
            <div style=${{display:"flex",flexWrap:"wrap",gap:10,marginTop:7}}>
              ${(atual.estado.duplas||[]).map(function(d){return html`<span key=${d.id} style=${{fontSize:13}}><span className="note" style=${{fontSize:11.5}}>${d.nome}: </span><b>${m.pontos[d.id]||0}</b></span>`;})}
            </div>
          </div>`; })}
        </div>
      </div>`:null}

      <div style=${{display:"flex",gap:8}}>
        ${encerrado?html`<button className="btn btn-ghost" style=${{flex:1}} onClick=${reabrir}>Reabrir jogo</button>`:html`<button className="btn btn-ghost" style=${{flex:1}} onClick=${encerrar}>Encerrar jogo</button>`}
        <button className="btn btn-ghost" onClick=${function(){apagarJogo(atual.id);}} style=${{color:"#C64B33"}}>Apagar</button>
      </div>
    </div>`;
  }

  // ---------- LISTA ----------
  var ativos=jogos.filter(function(j){return j.status!=="encerrado";});
  var encerrados=jogos.filter(function(j){return j.status==="encerrado";});
  return html`<div className="wrap">
    <button className="btn btn-ghost" style=${{padding:"7px 12px",fontSize:13,marginBottom:12}} onClick=${props.onSair}>← Jogos</button>
    <div className="eyebrow">Jogos de mesa</div>
    <div className="h1" style=${{marginBottom:4}}>🃏 Placar de Buraco</div>
    <div className="note" style=${{marginBottom:16}}>Marque as duplas e conte os pontos de cada mão automaticamente.</div>

    <button className="capa-portal anim" style=${{background:"linear-gradient(150deg,#3E7C59,#2C5C42)",marginBottom:18}} onClick=${function(){setDuplas([{id:"d1",nome:"Nós",jog:""},{id:"d2",nome:"Eles",jog:""}]);setMeta(3000);setVista("novo");}}>
      <div className="pt-bolha"></div><div className="pt-seta">→</div>
      <div style=${{position:"relative",zIndex:1}}><div className="pt-emoji">🃏</div><div className="pt-tit">Novo jogo</div><div className="pt-desc">Montar mesa e definir a meta</div></div>
    </button>

    ${ativos.length?html`<div style=${{marginBottom:16}}>
      <div className="eyebrow" style=${{marginBottom:8}}>Em andamento</div>
      <div style=${{display:"flex",flexDirection:"column",gap:8}}>
        ${ativos.map(function(j){ var tt=totais(j); var lm=lider(j); return html`<button key=${j.id} className="card" onClick=${function(){abrir(j);}} style=${{border:"none",cursor:"pointer",textAlign:"left",padding:"13px 15px"}}>
          <div style=${{fontWeight:700,fontSize:15}}>${j.titulo}</div>
          <div className="note" style=${{marginTop:3}}>${(j.estado.maos||[]).length} mão(s) · líder: ${lm.empate?"empate":nomeDupla(j,lm.quem)+" ("+lm.pontos+")"} · meta ${j.estado.meta||3000}</div>
        </button>`; })}
      </div>
    </div>`:null}

    ${encerrados.length?html`<div>
      <div className="eyebrow" style=${{marginBottom:8}}>Histórico</div>
      <div style=${{display:"flex",flexDirection:"column",gap:8}}>
        ${encerrados.map(function(j){ var tt=totais(j); return html`<button key=${j.id} className="card" onClick=${function(){abrir(j);}} style=${{border:"none",cursor:"pointer",textAlign:"left",padding:"13px 15px",opacity:.9}}>
          <div style=${{fontWeight:700,fontSize:15}}>🏆 ${j.vencedor?nomeDupla(j,j.vencedor):"—"}</div>
          <div className="note" style=${{marginTop:3}}>${j.titulo} · ${new Date(j.criado_em).toLocaleDateString("pt-BR")}</div>
        </button>`; })}
      </div>
    </div>`:null}

    ${!ativos.length&&!encerrados.length?html`<div className="card" style=${{padding:"26px 18px",textAlign:"center"}}><div style=${{fontSize:32}}>🃏</div><div style=${{fontWeight:700,marginTop:8}}>Nenhum jogo ainda</div><div className="note" style=${{marginTop:6}}>Toque em "Novo jogo" para começar a contar.</div></div>`:null}
  </div>`;
}

   CAÇA AO TESOURO · fotos viram anime, papéis liberam a próxima
   ============================================================ */
const CORES_CT=["#6E5A8E","#EC6A4C","#2E8B83","#C64B33","#3E7C59","#B84A8F","#D9A441","#4A6FA5"];

function fmtHora(iso){ if(!iso)return""; try{return new Date(iso).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});}catch(e){return"";} }

function b64ToBlobCT(b64,mime){ var bin=atob(b64); var len=bin.length; var arr=new Uint8Array(len); for(var i=0;i<len;i++){arr[i]=bin.charCodeAt(i);} return new Blob([arr],{type:mime||"image/jpeg"}); }

function CacaTesouro(props){
  const toast=props.toast||function(){};
  const ehPai=(props.papel==="pai"||props.papel==="mae");
  const nomeAtual=(props.nome||"").trim();

  const [vista,setVista]=useState("lista");        // lista | nova | editar | jogar | painel
  const [cacas,setCacas]=useState([]);
  const [carregando,setCarregando]=useState(true);
  const [semTabela,setSemTabela]=useState(false);
  const [cacaAtual,setCacaAtual]=useState(null);
  const [grupos,setGrupos]=useState([]);
  const [etapas,setEtapas]=useState([]);
  const [meuGrupoId,setMeuGrupoId]=useState(null);

  const [titNovaCaca,setTitNovaCaca]=useState("");

  const [novoGrupoNome,setNovoGrupoNome]=useState("");
  const [novoGrupoCor,setNovoGrupoCor]=useState(CORES_CT[0]);
  const [novoGrupoMembros,setNovoGrupoMembros]=useState("");

  const [etapaGrupoSel,setEtapaGrupoSel]=useState(null);
  const [etapaDica,setEtapaDica]=useState("");
  const [etapaCodigo,setEtapaCodigo]=useState("");
  const [etapaFotoOrig,setEtapaFotoOrig]=useState(null);
  const [etapaFotoAnime,setEtapaFotoAnime]=useState(null);
  const [gerandoAnime,setGerandoAnime]=useState(false);
  const [salvandoEtapa,setSalvandoEtapa]=useState(false);

  const [codigoDigitado,setCodigoDigitado]=useState("");
  const [validando,setValidando]=useState(false);
  const [erroCodigo,setErroCodigo]=useState("");

  const carregarCacas=async function(){
    setCarregando(true);
    var r=await sb.from("cacas_tesouro").select("*").order("criado_em",{ascending:false});
    if(r.error){ setCarregando(false); if((r.error.message||"").indexOf("cacas_tesouro")>=0||r.error.code==="42P01"){setSemTabela(true);} else {toast(r.error.message);} return; }
    setCacas(r.data||[]); setSemTabela(false); setCarregando(false);
  };
  useEffect(function(){ carregarCacas(); },[]);

  const carregarDetalhe=async function(caca){
    var rg=await sb.from("ct_grupos").select("*").eq("caca_id",caca.id).order("criado_em",{ascending:true});
    if(rg.error){toast(rg.error.message);return;}
    var re=await sb.from("ct_etapas").select("*").eq("caca_id",caca.id).order("ordem",{ascending:true});
    if(re.error){toast(re.error.message);return;}
    setGrupos(rg.data||[]); setEtapas(re.data||[]);
    var meu=(rg.data||[]).find(function(g){ return (g.membros||[]).some(function(m){ return (m||"").trim().toLowerCase()===nomeAtual.toLowerCase(); }); });
    setMeuGrupoId(meu?meu.id:null);
  };

  function voltarLista(){ setVista("lista"); setCacaAtual(null); carregarCacas(); }
  function abrirEditar(c){ setCacaAtual(c); setEtapaGrupoSel(null); carregarDetalhe(c); setVista("editar"); }
  function abrirJogar(c){ setCacaAtual(c); setCodigoDigitado(""); setErroCodigo(""); carregarDetalhe(c); setVista("jogar"); }
  function abrirPainel(c){ setCacaAtual(c); carregarDetalhe(c); setVista("painel"); }

  async function criarCaca(){
    if(!titNovaCaca.trim()){toast("Dê um nome para a caça ao tesouro.");return;}
    var r=await sb.from("cacas_tesouro").insert({titulo:titNovaCaca.trim(),status:"rascunho"}).select().single();
    if(r.error){toast(r.error.message);return;}
    setTitNovaCaca("");
    abrirEditar(r.data);
    toast("Caça criada — agora monte os grupos e as pistas 🗺️");
  }

  async function mudarStatus(novo){
    if(!cacaAtual)return;
    if(novo==="ativa"){
      var semEtapa=grupos.find(function(g){ return etapas.filter(function(e){return e.grupo_id===g.id;}).length===0; });
      if(grupos.length<2){toast("Cadastre pelo menos 2 grupos antes de ativar.");return;}
      if(semEtapa){toast("O grupo "+semEtapa.nome+" ainda não tem nenhuma pista.");return;}
    }
    var r=await sb.from("cacas_tesouro").update({status:novo}).eq("id",cacaAtual.id).select().single();
    if(r.error){toast(r.error.message);return;}
    setCacaAtual(r.data);
    toast(novo==="ativa"?"Caça ativada — bora esconder os papéis! 🏁":novo==="encerrada"?"Caça encerrada":"Caça reaberta para edição");
  }

  async function adicionarGrupo(){
    if(!novoGrupoNome.trim()){toast("Dê um nome ao grupo (ex: Larissa, Dupla Azul).");return;}
    var membrosArr=novoGrupoMembros.split(",").map(function(s){return s.trim();}).filter(Boolean);
    var r=await sb.from("ct_grupos").insert({caca_id:cacaAtual.id,nome:novoGrupoNome.trim(),cor:novoGrupoCor,membros:membrosArr,etapa_atual:1}).select().single();
    if(r.error){toast(r.error.message);return;}
    setNovoGrupoNome(""); setNovoGrupoMembros(""); setNovoGrupoCor(CORES_CT[grupos.length%CORES_CT.length]);
    carregarDetalhe(cacaAtual);
    toast("Grupo "+r.data.nome+" criado");
  }
  async function apagarGrupo(id){
    if(!window.confirm("Apagar este grupo e todas as pistas dele?"))return;
    var r=await sb.from("ct_grupos").delete().eq("id",id);
    if(r.error){toast(r.error.message);return;}
    if(etapaGrupoSel===id)setEtapaGrupoSel(null);
    carregarDetalhe(cacaAtual);
  }

  async function prepImgCT(file){
    const bmp=await createImageBitmap(file);
    const max=1800; let w=bmp.width,h=bmp.height;
    if(Math.max(w,h)>max){ const r=max/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
    const c=document.createElement("canvas"); c.width=w; c.height=h;
    c.getContext("2d").drawImage(bmp,0,0,w,h);
    const url=c.toDataURL("image/jpeg",0.88);
    return {base64:url.split(",")[1], mediaType:"image/jpeg"};
  }

  async function escolherFotoEtapa(e){
    var file=e.target.files&&e.target.files[0]; if(!file)return;
    try{
      var img=await prepImgCT(file);
      setEtapaFotoOrig(img); setEtapaFotoAnime(null);
      setGerandoAnime(true);
      var r=await sb.functions.invoke("ct-gerar-anime",{body:{imagem:img.base64,mediaType:img.mediaType}});
      if(r.error)throw r.error;
      var d=r.data||{};
      if(d.error)throw new Error(d.error);
      if(!d.imagem)throw new Error("resposta sem imagem");
      setEtapaFotoAnime({base64:d.imagem,mediaType:d.mediaType||"image/jpeg"});
    }catch(err){
      var em=String((err&&err.message)||err||"");
      if(em.indexOf("not found")>=0||em.indexOf("404")>=0||em.indexOf("Failed to send")>=0){toast("A função ct-gerar-anime não foi encontrada no Supabase. Faça o deploy dela.");}
      else{toast("Não consegui transformar em anime ("+em.slice(0,80)+"). Vou salvar com a foto original.");}
    }finally{ setGerandoAnime(false); e.target.value=""; }
  }

  async function escolherFotoAnimeManual(e){
    var file=e.target.files&&e.target.files[0]; if(!file)return;
    try{
      var img=await prepImgCT(file);
      setEtapaFotoAnime(img);
      toast("Foto anime enviada 🎨");
    }catch(err){ toast("Não consegui ler essa imagem. Tente outra."); }
    finally{ e.target.value=""; }
  }

  async function salvarEtapa(){
    if(!etapaGrupoSel){toast("Escolha o grupo desta pista.");return;}
    if(!etapaDica.trim()){toast("Escreva a dica.");return;}
    if(!etapaCodigo.trim()){toast("Defina o código do papel.");return;}
    if(!etapaFotoOrig){toast("Tire a foto do local.");return;}
    setSalvandoEtapa(true);
    try{
      var proximaOrdem=1+etapas.filter(function(e){return e.grupo_id===etapaGrupoSel;}).length;
      var caminho=cacaAtual.id+"/"+etapaGrupoSel+"/"+proximaOrdem;
      var origBlob=b64ToBlobCT(etapaFotoOrig.base64,etapaFotoOrig.mediaType);
      var upO=await sb.storage.from("ct-fotos").upload(caminho+"-original.jpg",origBlob,{contentType:etapaFotoOrig.mediaType,upsert:true});
      if(upO.error)throw upO.error;
      var urlO=sb.storage.from("ct-fotos").getPublicUrl(caminho+"-original.jpg").data.publicUrl;
      var urlA=urlO;
      if(etapaFotoAnime){
        var animeBlob=b64ToBlobCT(etapaFotoAnime.base64,etapaFotoAnime.mediaType);
        var upA=await sb.storage.from("ct-fotos").upload(caminho+"-anime.jpg",animeBlob,{contentType:etapaFotoAnime.mediaType,upsert:true});
        if(upA.error)throw upA.error;
        urlA=sb.storage.from("ct-fotos").getPublicUrl(caminho+"-anime.jpg").data.publicUrl;
      }
      var r=await sb.from("ct_etapas").insert({caca_id:cacaAtual.id,grupo_id:etapaGrupoSel,ordem:proximaOrdem,dica:etapaDica.trim(),codigo:etapaCodigo.trim().toUpperCase(),foto_original_url:urlO,foto_anime_url:urlA});
      if(r.error)throw r.error;
      setEtapaDica(""); setEtapaCodigo(""); setEtapaFotoOrig(null); setEtapaFotoAnime(null);
      carregarDetalhe(cacaAtual);
      toast("Pista "+proximaOrdem+" salva 🧩");
    }catch(err){ toast("Erro ao salvar: "+String((err&&err.message)||err).slice(0,120)); }
    finally{ setSalvandoEtapa(false); }
  }
  async function apagarEtapa(id){
    if(!window.confirm("Apagar esta pista?"))return;
    var r=await sb.from("ct_etapas").delete().eq("id",id);
    if(r.error){toast(r.error.message);return;}
    carregarDetalhe(cacaAtual);
  }

  async function tentarCodigo(){
    if(!meuGrupoId){toast("Você não está em nenhum grupo desta caça.");return;}
    var grupo=grupos.find(function(g){return g.id===meuGrupoId;});
    if(!grupo)return;
    var digitado=codigoDigitado.trim().toUpperCase();
    if(!digitado)return;
    var minhasEtapas=etapas.filter(function(e){return e.grupo_id===meuGrupoId;}).sort(function(a,b){return a.ordem-b.ordem;});
    var etapaAlvo=minhasEtapas.find(function(e){return e.ordem===grupo.etapa_atual;});
    setValidando(true); setErroCodigo("");
    var sucesso=!!(etapaAlvo && etapaAlvo.codigo===digitado);
    await sb.from("ct_tentativas").insert({caca_id:cacaAtual.id,grupo_id:meuGrupoId,codigo_tentado:digitado,sucesso:sucesso});
    if(sucesso){
      var proxOrdem=grupo.etapa_atual+1;
      var concluiu=proxOrdem>minhasEtapas.length;
      var patch={etapa_atual:proxOrdem};
      if(concluiu)patch.concluido_em=new Date().toISOString();
      var r=await sb.from("ct_grupos").update(patch).eq("id",meuGrupoId).select().single();
      if(!r.error){ setGrupos(function(gs){return gs.map(function(g){return g.id===meuGrupoId?r.data:g;});}); }
      setCodigoDigitado("");
      toast(concluiu?"🏆 Tesouro encontrado!":"Pista liberada! 🔓");
    } else {
      setErroCodigo("Código incorreto — confira o papel e tente de novo.");
    }
    setValidando(false);
  }

  useEffect(function(){
    if(vista!=="painel"||!cacaAtual)return;
    var ch=sb.channel("ct-painel-"+cacaAtual.id)
      .on("postgres_changes",{event:"*",schema:"public",table:"ct_grupos",filter:"caca_id=eq."+cacaAtual.id},function(){carregarDetalhe(cacaAtual);})
      .on("postgres_changes",{event:"*",schema:"public",table:"ct_tentativas",filter:"caca_id=eq."+cacaAtual.id},function(){carregarDetalhe(cacaAtual);})
      .subscribe();
    return function(){ sb.removeChannel(ch); };
  },[vista, cacaAtual&&cacaAtual.id]);

  // =========================================================
  const voltar=html`<button className="btn btn-ghost" style=${{padding:"7px 12px",fontSize:13,marginBottom:12}} onClick=${voltarLista}>← Caça ao Tesouro</button>`;

  if(carregando) return html`<div className="wrap"><div className="note">Carregando…</div></div>`;

  if(semTabela) return html`<div className="wrap">
    <button className="btn btn-ghost" style=${{padding:"7px 12px",fontSize:13,marginBottom:14}} onClick=${props.onSair}>← Jogos</button>
    <div className="eyebrow">Caça ao Tesouro</div>
    <div className="h1" style=${{marginBottom:6}}>🗺️ Falta criar as tabelas</div>
    <div className="card" style=${{padding:16}}>
      <div className="note" style=${{marginBottom:10}}>Rode este SQL no painel do Supabase (uma vez só) para ativar o jogo:</div>
      <pre style=${{whiteSpace:"pre-wrap",fontSize:11.5,fontFamily:"monospace",background:"#F6F1E9",padding:12,borderRadius:10,overflow:"auto"}}>${SQL_CT}</pre>
      <button className="btn btn-primary" style=${{marginTop:12}} onClick=${carregarCacas}>Já rodei — recarregar</button>
    </div>
  </div>`;

  // ---------- NOVA CAÇA ----------
  if(vista==="nova") return html`<div className="wrap">
    ${voltar}
    <div className="eyebrow">Nova caça</div>
    <div className="h1" style=${{marginBottom:14}}>🗺️ Dar nome à caça</div>
    <div className="card" style=${{padding:14}}>
      <span className="label">Nome da caça (ex: Aniversário da Lari, Páscoa 2027)</span>
      <input className="input" value=${titNovaCaca} onChange=${function(e){setTitNovaCaca(e.target.value);}}/>
    </div>
    <button className="btn btn-primary" style=${{marginTop:14}} onClick=${criarCaca}>Criar e montar as pistas</button>
  </div>`;

  // ---------- EDITAR (ADMIN) ----------
  if(vista==="editar" && cacaAtual){
    var podeEditar=cacaAtual.status==="rascunho";
    var etapasDoGrupoSel=etapaGrupoSel?etapas.filter(function(e){return e.grupo_id===etapaGrupoSel;}).sort(function(a,b){return a.ordem-b.ordem;}):[];
    return html`<div className="wrap">
      ${voltar}
      <div className="eyebrow">${cacaAtual.status==="rascunho"?"Em montagem":cacaAtual.status==="ativa"?"Ativa":"Encerrada"}</div>
      <div className="h1" style=${{marginBottom:10}}>🗺️ ${cacaAtual.titulo}</div>

      <div style=${{display:"flex",gap:8,marginBottom:18,flexWrap:"wrap"}}>
        ${cacaAtual.status==="rascunho"?html`<button className="btn btn-primary" style=${{flex:"none"}} onClick=${function(){mudarStatus("ativa");}}>Ativar caça 🏁</button>`:null}
        ${cacaAtual.status==="ativa"?html`<button className="btn btn-ghost" onClick=${function(){mudarStatus("encerrada");}}>Encerrar</button><button className="btn btn-ghost" onClick=${function(){abrirPainel(cacaAtual);}}>📊 Painel ao vivo</button>`:null}
        ${cacaAtual.status==="encerrada"?html`<button className="btn btn-ghost" onClick=${function(){mudarStatus("rascunho");}}>Reabrir para editar</button>`:null}
      </div>

      <div className="eyebrow" style=${{marginBottom:8}}>Grupos (${grupos.length})</div>
      <div style=${{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
        ${grupos.map(function(g){ var qtd=etapas.filter(function(e){return e.grupo_id===g.id;}).length; return html`<div key=${g.id} className="card" style=${{padding:"11px 13px",display:"flex",alignItems:"center",gap:10}}>
          <div style=${{width:16,height:16,borderRadius:99,background:g.cor,flex:"none"}}></div>
          <div style=${{flex:1,minWidth:0}}>
            <div style=${{fontWeight:700,fontSize:14.5}}>${g.nome}</div>
            <div className="note" style=${{fontSize:11.5}}>${(g.membros||[]).join(", ")||"sem integrantes definidos"} · ${qtd} pista(s)</div>
          </div>
          ${podeEditar?html`<button onClick=${function(){apagarGrupo(g.id);}} style=${{border:"none",background:"none",color:"#C64B33",fontSize:15,cursor:"pointer",flex:"none"}}>🗑</button>`:null}
        </div>`; })}
      </div>

      ${podeEditar?html`<div className="card" style=${{padding:14,marginBottom:20}}>
        <div style=${{fontWeight:700,marginBottom:8}}>+ Novo grupo</div>
        <input className="input" style=${{marginBottom:8}} placeholder="Nome do grupo (ex: Larissa, Dupla Verde)" value=${novoGrupoNome} onChange=${function(e){setNovoGrupoNome(e.target.value);}}/>
        <input className="input" style=${{marginBottom:8}} placeholder="Integrantes, separados por vírgula" value=${novoGrupoMembros} onChange=${function(e){setNovoGrupoMembros(e.target.value);}}/>
        <span className="label">Cor do grupo</span>
        <div style=${{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
          ${CORES_CT.map(function(c){return html`<button key=${c} onClick=${function(){setNovoGrupoCor(c);}} style=${{width:30,height:30,borderRadius:99,background:c,border:novoGrupoCor===c?"3px solid #2A2233":"3px solid transparent",cursor:"pointer"}}></button>`;})}
        </div>
        <button className="btn btn-primary" onClick=${adicionarGrupo}>Adicionar grupo</button>
      </div>`:null}

      <div className="eyebrow" style=${{marginBottom:8}}>Pistas</div>
      ${grupos.length===0?html`<div className="note" style=${{marginBottom:14}}>Cadastre os grupos acima antes de montar as pistas.</div>`:html`<div style=${{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
        ${grupos.map(function(g){return html`<button key=${g.id} onClick=${function(){setEtapaGrupoSel(g.id);}} style=${{padding:"7px 13px",borderRadius:999,border:etapaGrupoSel===g.id?"2px solid #2A2233":"1px solid #ECE3D8",background:g.cor,color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer"}}>${g.nome}</button>`;})}
      </div>`}

      ${etapaGrupoSel?html`<div style=${{marginBottom:14}}>
        ${etapasDoGrupoSel.length?html`<div style=${{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
          ${etapasDoGrupoSel.map(function(e){return html`<div key=${e.id} className="card" style=${{padding:"10px 12px",display:"flex",gap:10,alignItems:"center"}}>
            ${e.foto_anime_url?html`<img src=${e.foto_anime_url} style=${{width:46,height:46,objectFit:"cover",borderRadius:9,flex:"none"}}/>`:null}
            <div style=${{flex:1,minWidth:0}}>
              <div style=${{fontWeight:700,fontSize:13.5}}>Pista ${e.ordem} · código ${e.codigo}</div>
              <div className="note" style=${{fontSize:11.5}}>${e.dica}</div>
            </div>
            ${podeEditar?html`<button onClick=${function(){apagarEtapa(e.id);}} style=${{border:"none",background:"none",color:"#C64B33",fontSize:15,cursor:"pointer",flex:"none"}}>🗑</button>`:null}
          </div>`;})}
        </div>`:null}

        ${podeEditar?html`<div className="card" style=${{padding:14}}>
          <div style=${{fontWeight:700,marginBottom:8}}>+ Pista ${etapasDoGrupoSel.length+1} para ${(grupos.find(function(g){return g.id===etapaGrupoSel;})||{}).nome}</div>
          <textarea className="input" style=${{marginBottom:8,minHeight:70}} placeholder="Dica que vai aparecer com a foto" value=${etapaDica} onChange=${function(e){setEtapaDica(e.target.value);}}></textarea>
          <input className="input" style=${{marginBottom:10,textTransform:"uppercase"}} placeholder="Código do papel escondido neste local" value=${etapaCodigo} onChange=${function(e){setEtapaCodigo(e.target.value);}}/>
          <input id="ctFotoEtapa" type="file" accept="image/*" capture="environment" style=${{display:"none"}} onChange=${escolherFotoEtapa}/>
          <button className="btn btn-ghost" style=${{width:"100%",marginBottom:10}} onClick=${function(){document.getElementById("ctFotoEtapa").click();}}>📷 ${etapaFotoOrig?"Trocar foto do local":"Tirar foto do local"}</button>
          ${gerandoAnime?html`<div className="note" style=${{marginBottom:10}}>Transformando em anime… ⏳</div>`:null}
          ${etapaFotoOrig&&!gerandoAnime?html`<input id="ctFotoAnimeManual" type="file" accept="image/*" style=${{display:"none"}} onChange=${escolherFotoAnimeManual}/><button className="btn btn-ghost" style=${{width:"100%",marginBottom:10}} onClick=${function(){document.getElementById("ctFotoAnimeManual").click();}}>🎨 ${etapaFotoAnime?"Trocar pela versão anime (de outro app)":"Enviar versão anime pronta (de outro app)"}</button>`:null}
          ${etapaFotoAnime?html`<img src=${"data:"+etapaFotoAnime.mediaType+";base64,"+etapaFotoAnime.base64} style=${{width:"100%",borderRadius:12,marginBottom:10}}/>`:etapaFotoOrig&&!gerandoAnime?html`<img src=${"data:"+etapaFotoOrig.mediaType+";base64,"+etapaFotoOrig.base64} style=${{width:"100%",borderRadius:12,marginBottom:10}}/>`:null}
          <button className="btn btn-primary" style=${{width:"100%"}} disabled=${salvandoEtapa||gerandoAnime} onClick=${salvarEtapa}>${salvandoEtapa?"Salvando…":"Salvar pista"}</button>
        </div>`:null}
      </div>`:null}
    </div>`;
  }

  // ---------- PAINEL AO VIVO (ADMIN) ----------
  if(vista==="painel" && cacaAtual){
    var ranking=grupos.slice().sort(function(a,b){
      if(a.concluido_em&&b.concluido_em)return new Date(a.concluido_em)-new Date(b.concluido_em);
      if(a.concluido_em)return -1; if(b.concluido_em)return 1;
      return (b.etapa_atual-a.etapa_atual);
    });
    return html`<div className="wrap">
      ${voltar}
      <div className="eyebrow">Painel ao vivo</div>
      <div className="h1" style=${{marginBottom:14}}>📊 ${cacaAtual.titulo}</div>
      <div style=${{display:"flex",flexDirection:"column",gap:10}}>
        ${ranking.map(function(g,idx){ var total=etapas.filter(function(e){return e.grupo_id===g.id;}).length; var feito=Math.min(g.etapa_atual-1,total); var pct=total?Math.round((feito/total)*100):0;
          return html`<div key=${g.id} className="card" style=${{padding:"13px 15px"}}>
          <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style=${{display:"flex",alignItems:"center",gap:9,minWidth:0}}>
              <div style=${{width:14,height:14,borderRadius:99,background:g.cor,flex:"none"}}></div>
              <div style=${{fontWeight:800,fontSize:15}}>${g.concluido_em?"🏆 ":idx===0&&feito>0?"👑 ":""}${g.nome}</div>
            </div>
            <div className="note" style=${{fontSize:12}}>${g.concluido_em?fmtHora(g.concluido_em):feito+"/"+total+" pistas"}</div>
          </div>
          <div style=${{height:7,background:"#F0EBE3",borderRadius:99,marginTop:9,overflow:"hidden"}}><div style=${{height:"100%",width:pct+"%",background:g.cor,borderRadius:99}}></div></div>
        </div>`; })}
      </div>
    </div>`;
  }

  // ---------- JOGAR ----------
  if(vista==="jogar" && cacaAtual){
    var meuGrupo=grupos.find(function(g){return g.id===meuGrupoId;});
    if(!meuGrupo) return html`<div className="wrap">
      ${voltar}
      <div className="card" style=${{padding:"26px 18px",textAlign:"center"}}>
        <div style=${{fontSize:32}}>🗺️</div>
        <div style=${{fontWeight:700,marginTop:8}}>Você não está em nenhum grupo desta caça</div>
        <div className="note" style=${{marginTop:6}}>Peça pro responsável te colocar em um grupo.</div>
      </div>
    </div>`;
    var minhasEtapas=etapas.filter(function(e){return e.grupo_id===meuGrupoId;}).sort(function(a,b){return a.ordem-b.ordem;});
    var concluiu=meuGrupo.etapa_atual>minhasEtapas.length;
    if(concluiu) return html`<div className="wrap">
      ${voltar}
      <div className="card" style=${{padding:"32px 18px",textAlign:"center",background:"linear-gradient(135deg,#FDEEE9,#E7F2F0)"}}>
        <div style=${{fontSize:44}}>🏆</div>
        <div style=${{fontWeight:800,fontSize:19,marginTop:8}}>Tesouro encontrado!</div>
        <div className="note" style=${{marginTop:6}}>Parabéns, ${meuGrupo.nome}! ${meuGrupo.concluido_em?"Concluído às "+fmtHora(meuGrupo.concluido_em)+".":""}</div>
      </div>
    </div>`;
    var etapaAtualObj=minhasEtapas.find(function(e){return e.ordem===meuGrupo.etapa_atual;});
    return html`<div className="wrap">
      ${voltar}
      <div style=${{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
        <div style=${{width:14,height:14,borderRadius:99,background:meuGrupo.cor,flex:"none"}}></div>
        <div className="eyebrow">${meuGrupo.nome} · pista ${meuGrupo.etapa_atual} de ${minhasEtapas.length}</div>
      </div>
      <div className="h1" style=${{marginBottom:14}}>🗺️ ${cacaAtual.titulo}</div>
      ${etapaAtualObj?html`<div className="card" style=${{padding:14,marginBottom:14}}>
        ${etapaAtualObj.foto_anime_url?html`<img src=${etapaAtualObj.foto_anime_url} style=${{width:"100%",borderRadius:12,marginBottom:12}}/>`:null}
        <div style=${{fontWeight:700,fontSize:16}}>${etapaAtualObj.dica}</div>
      </div>`:html`<div className="note" style=${{marginBottom:14}}>Aguardando a próxima pista…</div>`}
      <div className="card" style=${{padding:14}}>
        <span className="label">Código do papel</span>
        <input className="input" style=${{textTransform:"uppercase",marginBottom:8}} value=${codigoDigitado} onChange=${function(e){setCodigoDigitado(e.target.value);setErroCodigo("");}} onKeyDown=${function(e){if(e.key==="Enter")tentarCodigo();}}/>
        ${erroCodigo?html`<div className="note" style=${{color:"#C64B33",marginBottom:8}}>${erroCodigo}</div>`:null}
        <button className="btn btn-primary" style=${{width:"100%"}} disabled=${validando} onClick=${tentarCodigo}>${validando?"Verificando…":"Destravar próxima pista"}</button>
      </div>
    </div>`;
  }

  // ---------- LISTA ----------
  var ativas=cacas.filter(function(c){return c.status==="ativa";});
  var rascunhos=cacas.filter(function(c){return c.status==="rascunho";});
  var encerradas=cacas.filter(function(c){return c.status==="encerrada";});
  return html`<div className="wrap">
    <button className="btn btn-ghost" style=${{padding:"7px 12px",fontSize:13,marginBottom:12}} onClick=${props.onSair}>← Jogos</button>
    <div className="eyebrow">Caça ao Tesouro</div>
    <div className="h1" style=${{marginBottom:4}}>🗺️ Siga as pistas</div>
    <div className="note" style=${{marginBottom:16}}>Fotos viram anime, papéis escondidos liberam o próximo passo.</div>

    ${ehPai?html`<button className="capa-portal anim" style=${{background:"linear-gradient(150deg,#D9A441,#B8842B)",marginBottom:18}} onClick=${function(){setTitNovaCaca("");setVista("nova");}}>
      <div className="pt-bolha"></div><div className="pt-seta">→</div>
      <div style=${{position:"relative",zIndex:1}}><div className="pt-emoji">🗺️</div><div className="pt-tit">Nova caça</div><div className="pt-desc">Montar grupos e esconder as pistas</div></div>
    </button>`:null}

    ${ativas.length?html`<div style=${{marginBottom:16}}>
      <div className="eyebrow" style=${{marginBottom:8}}>Em andamento</div>
      <div style=${{display:"flex",flexDirection:"column",gap:8}}>
        ${ativas.map(function(c){return html`<div key=${c.id} className="card" style=${{padding:"13px 15px"}}>
          <div style=${{fontWeight:700,fontSize:15,marginBottom:8}}>${c.titulo}</div>
          <div style=${{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button className="btn btn-primary" style=${{flex:"none",padding:"8px 14px"}} onClick=${function(){abrirJogar(c);}}>Jogar</button>
            ${ehPai?html`<button className="btn btn-ghost" style=${{flex:"none",padding:"8px 14px"}} onClick=${function(){abrirPainel(c);}}>📊 Painel</button><button className="btn btn-ghost" style=${{flex:"none",padding:"8px 14px"}} onClick=${function(){abrirEditar(c);}}>✏️ Editar</button>`:null}
          </div>
        </div>`;})}
      </div>
    </div>`:null}

    ${ehPai&&rascunhos.length?html`<div style=${{marginBottom:16}}>
      <div className="eyebrow" style=${{marginBottom:8}}>Em montagem</div>
      <div style=${{display:"flex",flexDirection:"column",gap:8}}>
        ${rascunhos.map(function(c){return html`<button key=${c.id} className="card" onClick=${function(){abrirEditar(c);}} style=${{border:"none",cursor:"pointer",textAlign:"left",padding:"13px 15px"}}>
          <div style=${{fontWeight:700,fontSize:15}}>${c.titulo}</div>
          <div className="note" style=${{marginTop:3}}>continuar montando →</div>
        </button>`;})}
      </div>
    </div>`:null}

    ${encerradas.length?html`<div>
      <div className="eyebrow" style=${{marginBottom:8}}>Histórico</div>
      <div style=${{display:"flex",flexDirection:"column",gap:8}}>
        ${encerradas.map(function(c){return html`<button key=${c.id} className="card" onClick=${function(){abrirPainel(c);}} style=${{border:"none",cursor:"pointer",textAlign:"left",padding:"13px 15px",opacity:.9}}>
          <div style=${{fontWeight:700,fontSize:15}}>${c.titulo}</div>
          <div className="note" style=${{marginTop:3}}>${new Date(c.criado_em).toLocaleDateString("pt-BR")} · encerrada</div>
        </button>`;})}
      </div>
    </div>`:null}

    ${!ativas.length&&!rascunhos.length&&!encerradas.length?html`<div className="card" style=${{padding:"26px 18px",textAlign:"center"}}><div style=${{fontSize:32}}>🗺️</div><div style=${{fontWeight:700,marginTop:8}}>Nenhuma caça ainda</div><div className="note" style=${{marginTop:6}}>${ehPai?"Toque em \"Nova caça\" para montar a primeira.":"Peça pro responsável montar a primeira caça."}</div></div>`:null}
  </div>`;
}

function Jogos(props){

  const [tela,setTela]=useState("casa");   // "casa" | id da criança
  const [jogoId,setJogoId]=useState(null);
  const toast=props.toast||function(){};
  const ehPai=(props.papel==="pai"||props.papel==="mae");
  const [importados,setImportados]=useState([]);
  const [impAberto,setImpAberto]=useState(false);
  const [impTxt,setImpTxt]=useState("");
  const [impPreview,setImpPreview]=useState(null);
  const carregarProvas=async function(){ var r=await sb.from("jogo_provas").select("*").order("criado_em",{ascending:false}); if(!r.error) setImportados(r.data||[]); };
  useEffect(function(){ carregarProvas(); },[]);
  function jogosDe(cid){ var base=(JOGOS_CATALOGO[cid]||[]).slice(); var imp=importados.filter(function(p){return p.crianca_id===cid;}).map(function(p){ return {id:"imp_"+p.id, tipo:"quiz", tit:p.titulo, materia:p.materia||"Prova", emoji:p.emoji||"📝", nivel:p.nivel||"Médio", tema:"padrao", desc:"Prova importada pelo papai", perguntas:p.perguntas||[], _impId:p.id}; }); return base.concat(imp); }
  async function salvarProva(cid,prev){ if(!prev||prev.erros.length||!prev.perguntas.length)return; var perguntas=prev.perguntas.map(function(p){return {q:p.q,op:p.op,c:p.c,materia:p.materia||prev.materia||"",exp:p.exp||""};}); var r=await sb.from("jogo_provas").insert({crianca_id:cid,titulo:prev.titulo||"Prova",materia:prev.materia||"",emoji:"📝",nivel:"Médio",perguntas:perguntas}); if(r.error){toast(r.error.message);return;} setImpAberto(false);setImpTxt("");setImpPreview(null);carregarProvas();toast("Prova importada! 📝"); }
  async function apagarProva(id){ if(!window.confirm("Apagar esta prova importada?"))return; var r=await sb.from("jogo_provas").delete().eq("id",id); if(r.error){toast(r.error.message);return;} carregarProvas(); }

  if(tela==="buraco") return html`<${Buraco} papel=${props.papel} nome=${props.nome} toast=${toast} onSair=${function(){setTela("casa");}}/>`;
  if(tela==="tesouro") return html`<${CacaTesouro} papel=${props.papel} nome=${props.nome} toast=${toast} onSair=${function(){setTela("casa");}}/>`;

  if(tela!=="casa" && jogoId){
    const crianca=CRIANCAS_JOGO.find(function(c){return c.id===tela;});
    const jogo=jogosDe(tela).find(function(j){return j.id===jogoId;});
    if(jogo) return html`<${JogoQuiz} jogo=${jogo} crianca=${crianca} onVoltar=${function(){setJogoId(null);}}/>`;
  }

  if(tela!=="casa"){
    const crianca=CRIANCAS_JOGO.find(function(c){return c.id===tela;});
    const jogos=jogosDe(tela);
    return html`<div className="wrap">
      <button className="btn btn-ghost" style=${{padding:"7px 12px",fontSize:13,marginBottom:14}} onClick=${function(){setTela("casa");}}>← Crianças</button>
      <div className="eyebrow">Jogos de ${crianca.nome}</div>
      <div className="h1" style=${{marginBottom:4}}>${crianca.emoji} ${crianca.nome} <span style=${{fontSize:15,color:"#857A8C",fontWeight:600}}>· ${crianca.idade} anos</span></div>
      <div className="note" style=${{marginBottom:16}}>Escolha um jogo para testar o que aprendeu.</div>
      ${ehPai?(impAberto?html`<div className="card" style=${{padding:14,marginBottom:14}}>
        <div style=${{fontWeight:700,marginBottom:6}}>📝 Importar prova</div>
        <div className="note" style=${{marginBottom:8}}>Cole a prova no formato de texto (uma por vez).</div>
        <textarea value=${impTxt} onChange=${function(e){setImpTxt(e.target.value);setImpPreview(null);}} placeholder=${"Prova: Frações\nMatéria: Matemática\n\nP: Quanto é 1/2 + 1/4?\n- 2/6\n- 3/4 *\n- 1/6"} style=${{width:"100%",minHeight:150,padding:"10px 12px",border:"1px solid #E4D9CC",borderRadius:10,fontSize:13.5,fontFamily:"monospace",boxSizing:"border-box"}}></textarea>
        ${impPreview?html`<div style=${{marginTop:10,padding:"10px 12px",borderRadius:10,background:impPreview.erros.length?"#fde7ef":"#E6F4EA"}}>
          <div style=${{fontWeight:700,fontSize:13.5}}>${impPreview.titulo||"(sem título)"} · ${impPreview.perguntas.length} pergunta(s)</div>
          ${impPreview.erros.length?html`<ul style=${{margin:"6px 0 0",paddingLeft:18,fontSize:12.5,color:"#C64B33"}}>${impPreview.erros.map(function(er,ix){return html`<li key=${ix}>${er}</li>`;})}</ul>`:html`<div className="note" style=${{marginTop:4,fontSize:12.5}}>✓ Pronta para salvar.</div>`}
        </div>`:null}
        <div style=${{display:"flex",gap:8,marginTop:10}}>
          ${!impPreview?html`<button className="btn btn-primary" style=${{flex:1}} onClick=${function(){setImpPreview(parseProvaTxt(impTxt));}}>Verificar</button>`:html`<button className="btn btn-primary" style=${{flex:1}} disabled=${impPreview.erros.length>0||!impPreview.perguntas.length} onClick=${function(){salvarProva(crianca.id,impPreview);}}>Salvar prova</button>`}
          <button className="btn btn-ghost" onClick=${function(){setImpAberto(false);setImpTxt("");setImpPreview(null);}}>Fechar</button>
        </div>
      </div>`:html`<button className="btn btn-ghost" style=${{width:"100%",marginBottom:14}} onClick=${function(){setImpAberto(true);}}>📝 Importar prova (papai)</button>`):null}
      ${ehPai&&importados.filter(function(p){return p.crianca_id===crianca.id;}).length?html`<div style=${{marginBottom:14}}>
        <div className="eyebrow" style=${{marginBottom:8}}>Provas importadas</div>
        <div style=${{display:"flex",flexDirection:"column",gap:6}}>${importados.filter(function(p){return p.crianca_id===crianca.id;}).map(function(p){return html`<div key=${p.id} className="card" style=${{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 12px"}}>
          <div style=${{minWidth:0}}><div style=${{fontWeight:600,fontSize:13.5}}>📝 ${p.titulo}</div><div className="note" style=${{fontSize:11.5}}>${(p.perguntas||[]).length} perguntas${p.materia?" · "+p.materia:""}</div></div>
          <button onClick=${function(){apagarProva(p.id);}} style=${{border:"none",background:"none",color:"#C64B33",fontSize:15,cursor:"pointer",flexShrink:0}}>🗑</button>
        </div>`;})}</div>
      </div>`:null}
      ${jogos.length===0?html`<div className="card" style=${{padding:"28px 18px",textAlign:"center"}}>
        <div style=${{fontSize:34}}>🎯</div>
        <div style=${{fontWeight:700,marginTop:8}}>Nenhum jogo ainda</div>
        <div className="note" style=${{marginTop:6}}>Peça pro papai criar o primeiro jogo da ${crianca.nome} com a matéria da prova.</div>
      </div>`:html`<div style=${{display:"flex",flexDirection:"column",gap:11}}>
        ${jogos.map(function(j){ return html`<button key=${j.id} className="card" onClick=${function(){setJogoId(j.id);}} style=${{border:"none",cursor:"pointer",textAlign:"left",padding:"15px 16px",display:"flex",alignItems:"center",gap:13,minWidth:0}}>
          <div style=${{fontSize:30,flex:"none"}}>${j.emoji}</div>
          <div style=${{flex:1,minWidth:0}}>
            <div style=${{fontWeight:700,fontSize:16}}>${j.tit}</div>
            <div className="note" style=${{marginTop:2}}>${j.desc}</div>
            <div style=${{display:"flex",gap:6,marginTop:7,flexWrap:"wrap"}}>
              <span className="chip" style=${{background:"#F0EBE3",color:"#6b6270"}}>${j.materia}</span>
              <span className="chip" style=${{background:"#F0EBE3",color:"#6b6270"}}>🎯 ${j.nivel}</span>
              <span className="chip" style=${{background:"#F0EBE3",color:"#6b6270"}}>${j.perguntas.length} perguntas</span>
            </div>
          </div>
          <div style=${{fontSize:18,color:"#857A8C",flex:"none"}}>→</div>
        </button>`; })}
      </div>`}
    </div>`;
  }

  return html`<div className="wrap">
    <div className="eyebrow">Jogos</div>
    <div className="h1" style=${{marginBottom:4}}>🎮 Jogar em família</div>
    <div className="note" style=${{marginBottom:16}}>O quiz das crianças e o placar dos jogos de mesa.</div>
    <button className="capa-portal anim" style=${{background:"linear-gradient(150deg,#3E7C59,#2C5C42)",marginBottom:20}} onClick=${function(){setTela("buraco");}}>
      <div className="pt-bolha"></div><div className="pt-seta">→</div>
      <div style=${{position:"relative",zIndex:1}}><div className="pt-emoji">🃏</div><div className="pt-tit">Placar de Buraco</div><div className="pt-desc">Contar pontos por dupla e por mão</div></div>
    </button>
    <button className="capa-portal anim" style=${{background:"linear-gradient(150deg,#D9A441,#B8842B)",marginBottom:20}} onClick=${function(){setTela("tesouro");}}>
      <div className="pt-bolha"></div><div className="pt-seta">→</div>
      <div style=${{position:"relative",zIndex:1}}><div className="pt-emoji">🗺️</div><div className="pt-tit">Caça ao Tesouro</div><div className="pt-desc">Siga as pistas e ache o tesouro</div></div>
    </button>
    <div className="eyebrow" style=${{marginBottom:10}}>Jogos das crianças</div>
    <div style=${{display:"grid",gridTemplateColumns:"1fr 1fr",gap:11}}>
      ${CRIANCAS_JOGO.map(function(c,idx){ var qtd=jogosDe(c.id).length; return html`<button key=${c.id} className="capa-portal anim" style=${{animationDelay:(idx*0.08)+"s",background:c.cor,minHeight:152}} onClick=${function(){setTela(c.id);}}>
        <div className="pt-bolha"></div>
        <div className="pt-seta">→</div>
        <div style=${{position:"relative",zIndex:1}}>
          <div style=${{fontSize:40,lineHeight:1}}>${c.emoji}</div>
          <div className="pt-tit" style=${{fontSize:20}}>${c.nome}</div>
          <div className="pt-desc">${c.idade} anos</div>
          <div className="pt-dado">${qtd===0?"em breve":(qtd+(qtd===1?" jogo":" jogos"))}</div>
        </div>
      </button>`; })}
    </div>
  </div>`;
}


function App(){
  const [sessao,setSessao]=useState(undefined);
  const [papel,setPapel]=useState("filha");
  const [nome,setNome]=useState("");
  const [aba,setAba]=useState("inicio");
  const [toastMsg,setToastMsg]=useState("");
  const [albumAtivo,setAlbumAtivo]=useState(false);
  const toggleAlbum=async function(v){ const r=await sb.from("config").upsert({chave:"album_ativo",valor:v?"1":"0"}); if(r.error){toast(r.error.message);return;} setAlbumAtivo(v); if(!v)setAba(function(a){return a==="album"?"inicio":a;}); toast(v?"Aba Álbum ativada ⚽":"Aba Álbum desativada"); };
  const toast=function(m){setToastMsg(m);setTimeout(function(){setToastMsg("");},3500);};
  useEffect(function(){
    sb.auth.getSession().then(function(r){setSessao(r.data.session);}).catch(function(){setSessao(null);});
    const sub=sb.auth.onAuthStateChange(function(_e,s){setSessao(s);});
    return function(){ if(sub&&sub.data&&sub.data.subscription) sub.data.subscription.unsubscribe(); };
  },[]);
  useEffect(function(){ if(sessao){ sb.from("membros").select("papel,nome").eq("id",sessao.user.id).single().then(function(r){if(r.data){setPapel(r.data.papel);setNome(r.data.nome||"");}}); sb.from("config").select("valor").eq("chave","album_ativo").maybeSingle().then(function(r){setAlbumAtivo(!!(r.data&&r.data.valor==="1"));}).catch(function(){}); } },[sessao]);
  if(sessao===undefined) return html`<div className="wrap" style=${{paddingTop:80,textAlign:"center",color:"#857A8C"}}>Carregando…</div>`;
  if(!sessao) return html`<div><${Login} toast=${toast}/>${toastMsg?html`<div className="toast">${toastMsg}</div>`:null}</div>`;
  if(aba==="inicio") return html`<div><${Inicio} papel=${papel} nome=${nome} albumAtivo=${albumAtivo} toast=${toast} ir=${function(a){setAba(a);}} sair=${function(){sb.auth.signOut();}}/>${toastMsg?html`<div className="toast">${toastMsg}</div>`:null}</div>`;
  return html`
    <div>
      <div style=${{maxWidth:560,margin:"0 auto",padding:"14px 18px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <button onClick=${function(){setAba("inicio");}} style=${{display:"flex",alignItems:"center",gap:8,background:"none",border:"none",cursor:"pointer",padding:0}}><span style=${{fontSize:20,color:"#2A2233",lineHeight:1}}>←</span><span className="eyebrow" style=${{display:"flex",alignItems:"center",gap:7}}><span style=${{fontSize:14}}>🏠</span>Hub da Família</span></button>
        <button className="btn btn-ghost" style=${{padding:"7px 12px",fontSize:13}} onClick=${function(){sb.auth.signOut();}}>Sair</button>
      </div>
      ${aba==="agenda"?html`<${Agenda} toast=${toast}/>`:aba==="painel"?html`<${Painel} papel=${papel} nome=${nome} albumAtivo=${albumAtivo} toggleAlbum=${toggleAlbum}/>`:aba==="album"?html`<${Album} papel=${papel} toast=${toast} toggleAlbum=${toggleAlbum}/>`:aba==="carteira"?html`<${Carteira} papel=${papel} nome=${nome} toast=${toast}/>`:aba==="mercado"?html`<${Mercado} toast=${toast}/>`:aba==="jogos"?html`<${Jogos} nome=${nome} papel=${papel} toast=${toast}/>`:html`<${Missoes} papel=${papel} nome=${nome} toast=${toast}/>`}
      <div className="tabs">
        <button className=${"tab"+(aba==="inicio"?" on":"")} onClick=${function(){setAba("inicio");}}>🏠<br/>Início</button>
        <button className=${"tab"+(aba==="agenda"?" on":"")} onClick=${function(){setAba("agenda");}}>📅<br/>Agenda</button>
        <button className=${"tab"+(aba==="missoes"?" on":"")} onClick=${function(){setAba("missoes");}}>✅<br/>Missões</button>
        <button className=${"tab"+(aba==="carteira"?" on":"")} onClick=${function(){setAba("carteira");}}>💰<br/>Carteira</button>
        <button className=${"tab"+(aba==="mercado"?" on":"")} onClick=${function(){setAba("mercado");}}>🛒<br/>Mercado</button>
        <button className=${"tab"+(aba==="jogos"?" on":"")} onClick=${function(){setAba("jogos");}}>🎮<br/>Jogos</button>
        ${albumAtivo?html`<button className=${"tab"+(aba==="album"?" on":"")} onClick=${function(){setAba("album");}}>⚽<br/>Álbum</button>`:null}
        ${(papel==="pai"||papel==="mae")?html`<button className=${"tab"+(aba==="painel"?" on":"")} onClick=${function(){setAba("painel");}}>📊<br/>Painel</button>`:null}
      </div>
      ${toastMsg?html`<div className="toast">${toastMsg}</div>`:null}
    </div>`;
}

} catch(err){ window.__erros.push('App: '+(err&&err.message?err.message:err)); window.__banner&&window.__banner(); }
